<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - సెల్లర్ పోర్టల్</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 pb-20 font-sans">
  <div class="max-w-md mx-auto bg-white p-5 rounded-2xl shadow-lg">
    <div class="flex items-center justify-between border-b pb-3 mb-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-store text-purple-700 text-2xl"></i>
        <h1 class="text-lg font-bold text-gray-800">సెల్లర్ డాష్‌బోర్డ్</h1>
      </div>
      <a href="index.html" class="text-xs bg-purple-100 text-purple-700 font-bold px-3 py-1 rounded-full">స్టోర్‌కు వెళ్లండి</a>
    </div>

    <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">ఉత్పత్తి పేరు*</label>
        <input type="text" id="title" required placeholder="ఉదా: ఆర్గానిక్ కొర్రలు (1kg)" class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">సెల్లర్ WhatsApp నంబర్* (ఆర్డర్ల కోసం)</label>
        <input type="tel" id="seller_phone" required placeholder="ఉదా: 919876543210 (91 తో మొదలుపెట్టండి)" class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">కేటగిరీ*</label>
          <select id="category" required class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
            <option value="grocery">కిరాణా & మిల్లెట్స్</option>
            <option value="women">ఉమెన్ & గర్ల్స్</option>
            <option value="men">మెన్ & బాయ్స్</option>
            <option value="kids">కిడ్స్ వేర్</option>
            <option value="home">హోమ్ & కిచెన్</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">స్టాక్ యూనిట్లు*</label>
          <input type="number" id="stock" value="20" required class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">అసలు ధర (MRP)*</label>
          <input type="number" id="mrp" required placeholder="200" class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">అమ్మకపు ధర (₹)*</label>
          <input type="number" id="price" required placeholder="140" class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">ఉత్పత్తి ఫోటో లింక్ (Image URL)*</label>
        <input type="url" id="image" required placeholder="https://..." class="w-full text-xs p-2.5 border rounded-lg focus:outline-purple-600">
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-[#9c27b0] text-white py-3 rounded-lg font-bold text-sm shadow hover:bg-purple-800 transition">
        ప్రొడక్ట్ లైవ్ చేయండి
      </button>
    </form>
  </div>

  <script>
    const API_URL = "https://meestore.onrender.com/api/products";

    async function handleProductSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.innerText = "అప్‌లోడ్ అవుతోంది...";
      btn.disabled = true;

      const payload = {
        title: document.getElementById("title").value,
        seller_phone: document.getElementById("seller_phone").value.replace(/\D/g, ''),
        category: document.getElementById("category").value,
        mrp: parseFloat(document.getElementById("mrp").value),
        price: parseFloat(document.getElementById("price").value),
        stock: parseInt(document.getElementById("stock").value),
        image: document.getElementById("image").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if(res.ok) {
          alert("ఉత్పత్తి విజయవంతంగా లైవ్ అయ్యింది!");
          document.getElementById("product-form").reset();
        } else {
          alert("ఎర్రర్ వచ్చింది, మళ్ళీ ప్రయత్నించండి.");
        }
      } catch(err) {
        alert("సర్వర్‌కు కనెక్ట్ కాలేకపోయాం. కొద్దిసేపటి తర్వాత ప్రయత్నించండి.");
      } finally {
        btn.innerText = "ప్రొడక్ట్ లైవ్ చేయండి";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
