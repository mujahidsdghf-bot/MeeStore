<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - సెల్లర్ హబ్</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .header-bar { background-color: #9c27b0; color: white; padding: 15px; }
    .card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .preview-box { width: 100%; height: 160px; border: 2px dashed #9c27b0; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fafafa; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div class="header-bar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-store me-2"></i>MeeStore Seller Hub</h5>
    <a href="index.html" class="btn btn-outline-light btn-sm">స్టోర్‌కి వెళ్లండి</a>
  </div>

  <div class="container my-4">
    <div id="authSection" class="row justify-content-center">
      <div class="col-md-5">
        <div class="card-box">
          <ul class="nav nav-pills nav-justified mb-3">
            <li class="nav-item"><button class="nav-link active" onclick="toggleAuth(true)">లాగిన్</button></li>
            <li class="nav-item"><button class="nav-link" onclick="toggleAuth(false)">కొత్త సెల్లర్</button></li>
          </ul>
          <form id="loginForm">
            <div class="mb-2"><input type="tel" id="loginPhone" class="form-control" placeholder="మొబైల్ నంబర్" required></div>
            <div class="mb-3"><input type="password" id="loginPass" class="form-control" placeholder="పాస్‌వర్డ్" required></div>
            <button type="submit" class="btn btn-primary w-100" style="background:#9c27b0; border:none;">లాగిన్</button>
          </form>
          <form id="regForm" class="d-none">
            <div class="mb-2"><input type="text" id="regShop" class="form-control" placeholder="దుకాణం పేరు" required></div>
            <div class="mb-2"><input type="tel" id="regPhone" class="form-control" placeholder="మొబైల్ నంబర్" required></div>
            <div class="mb-2"><input type="text" id="regUpi" class="form-control" placeholder="మీ UPI ID" required></div>
            <div class="mb-3"><input type="password" id="regPass" class="form-control" placeholder="పాస్‌వర్డ్" required></div>
            <button type="submit" class="btn btn-success w-100">రిజిస్టర్ అవ్వండి</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Seller Dashboard -->
    <div id="dashboardSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-secondary" id="welcomeShopName">హలో సెల్లర్!</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">లాగౌట్</button>
      </div>

      <!-- Add Complete Product Form -->
      <div class="card-box mb-4">
        <h5 class="fw-bold mb-3 text-purple" style="color:#9c27b0;">కొత్త ప్రొడక్ట్ పూర్తి వివరాలతో జోడించండి</h5>
        <form id="addProductForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">ఉత్పత్తి పేరు</label>
              <input type="text" id="pName" class="form-control" placeholder="ఉదా: రాగి పిండి, లేడీస్ డ్రెస్" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">కేటగిరీ</label>
              <select id="pCategory" class="form-select" onchange="toggleFoodFields(this.value)" required>
                <option value="కిరాణా & మినరల్స్">🌾 కిరాణా & మినరల్స్ (ఆహార పదార్థాలు)</option>
                <option value="జనరల్ & పూజా స్టోర్">🪔 జనరల్ & పూజా స్టోర్</option>
                <option value="Women Fashion">👗 Women Fashion</option>
                <option value="Men Fashion">👕 Men Fashion</option>
                <option value="ఫ్యాన్సీ & జ్యువెలరీ">💍 ఫ్యాన్సీ & జ్యువెలరీ</option>
                <option value="ఫుట్‌వేర్">👠 ఫుట్‌వేర్</option>
                <option value="Home & Kitchen">🏠 Home & Kitchen</option>
                <option value="Beauty & Health">💄 Beauty & Health</option>
              </select>
            </div>

            <!-- కెమెరా & గ్యాలరీ ఫోటో అప్‌లోడ్ (లింక్ అవసరం లేదు) -->
            <div class="col-md-12">
              <label class="form-label fw-bold">ప్రొడక్ట్ ఫోటో (కెమెరా లేదా గ్యాలరీ నుండి ఎంచుకోండి)</label>
              <div class="preview-box mb-2" id="previewContainer">
                <span class="text-muted"><i class="fa-solid fa-camera fa-2x me-2"></i>ఫోటో ఇంకా ఎంచుకోలేదు</span>
              </div>
              <input type="file" id="productImageFile" class="form-control" accept="image/*" onchange="previewProductImg(this)" required>
            </div>

            <!-- ధర & స్టాక్ -->
            <div class="col-md-4">
              <label class="form-label fw-bold">ధర (₹)</label>
              <input type="number" id="pPrice" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">అందుబాటులో ఉన్న స్టాక్</label>
              <input type="number" id="pStock" class="form-control" value="10" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">రంగు (Color)</label>
              <input type="text" id="pColor" class="form-control" placeholder="ఉదా: రెడ్ / బ్రౌన్">
            </div>

            <!-- కొలతలు & వెయిట్ (కొరియర్ కొరకు) -->
            <div class="col-md-3">
              <label class="form-label fw-bold">బరువు (Weight in Grams/Kg)</label>
              <input type="text" id="pWeight" class="form-control" placeholder="ఉదా: 500g లేదా 1kg" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">కొలతలు (L x W x H)</label>
              <input type="text" id="pDimensions" class="form-control" placeholder="ఉదా: 15x10x5 cm">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">మెటీరియల్ టైప్</label>
              <input type="text" id="pMaterial" class="form-control" placeholder="కాటన్ / ప్లాస్టిక్ / గ్లాస్">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">మెటీరియల్ నేచర్</label>
              <select id="pHazard" class="form-select">
                <option value="Non-Hazardous">సాధారణమైనది (సురక్షితం)</option>
                <option value="Fragile">పగిలిపోయే వస్తువు (Fragile)</option>
                <option value="Liquid">ద్రవ పదార్థం (Liquid)</option>
                <option value="Hazardous">ప్రమాదకరమైనది / మండే స్వభావం</option>
              </select>
            </div>

            <!-- ఫుడ్ ఐటమ్స్ అయితే లైసెన్స్ & ఎక్స్‌పైరీ డేట్ -->
            <div class="col-md-6" id="fssaiBox">
              <label class="form-label fw-bold text-success">FSSAI ఫుడ్ లైసెన్స్ నంబర్</label>
              <input type="text" id="pFssai" class="form-control" placeholder="14 అంకెల FSSAI నంబర్">
            </div>
            <div class="col-md-6" id="expiryBox">
              <label class="form-label fw-bold">వ్యాలిడిటీ / ఎక్స్‌పైరీ డేట్</label>
              <input type="date" id="pExpiry" class="form-control">
            </div>

            <div class="col-12 mt-3">
              <button type="submit" id="btnLive" class="btn btn-primary w-100 py-2 fw-bold" style="background:#9c27b0; border:none;">
                <i class="fa-solid fa-cloud-arrow-up me-2"></i>ప్రొడక్ట్ పూర్తి వివరాలతో లైవ్ చేయండి
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- సెల్లర్ ఇన్వెంటరీ -->
      <div class="card-box">
        <h5 class="fw-bold mb-3">మీ ఇన్వెంటరీ (వస్తువులు & బరువు)</h5>
        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th>ఫోటో</th>
                <th>పేరు</th>
                <th>కేటగిరీ</th>
                <th>ధర</th>
                <th>బరువు</th>
                <th>స్టాక్</th>
              </tr>
            </thead>
            <tbody id="inventoryList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://meestore.onrender.com/api";
    let curSeller = JSON.parse(localStorage.getItem('meestore_seller'));
    let selectedImageBase64 = "";

    function toggleAuth(isLogin) {
      document.getElementById('loginForm').classList.toggle('d-none', !isLogin);
      document.getElementById('regForm').classList.toggle('d-none', isLogin);
    }

    // Camera / Gallery Image Preview
    function previewProductImg(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageBase64 = e.target.result;
          document.getElementById('previewContainer').innerHTML = `<img src="${selectedImageBase64}">`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function toggleFoodFields(cat) {
      const isFood = cat.includes('కిరాణా');
      document.getElementById('fssaiBox').style.display = isFood ? 'block' : 'none';
      document.getElementById('expiryBox').style.display = isFood ? 'block' : 'none';
    }

    document.getElementById('addProductForm').onsubmit = async (e) => {
      e.preventDefault();
      if(!selectedImageBase64) { alert("దయచేసి ప్రొడక్ట్ ఫోటోను కెమెరా లేదా గ్యాలరీ ద్వారా ఎంచుకోండి!"); return; }

      const btn = document.getElementById('btnLive');
      btn.disabled = true;
      btn.innerText = "అప్‌లోడ్ అవుతోంది...";

      const payload = {
        seller_id: curSeller.id,
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        price: document.getElementById('pPrice').value,
        mrp: document.getElementById('pPrice').value,
        stock: document.getElementById('pStock').value,
        image_url: selectedImageBase64, // Direct Base64 Image
        seller_phone: curSeller.phone,
        seller_upi: curSeller.upi_id,
        weight: document.getElementById('pWeight').value,
        color: document.getElementById('pColor').value,
        dimensions: document.getElementById('pDimensions').value,
        material: document.getElementById('pMaterial').value,
        hazard_type: document.getElementById('pHazard').value,
        fssai: document.getElementById('pFssai').value,
        expiry: document.getElementById('pExpiry').value
      };

      const res = await fetch(`${API}/products`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      if(res.ok) {
        alert("🎉 ప్రొడక్ట్ అన్ని స్పెసిఫికేషన్లతో లైవ్ అయ్యింది!");
        loadDashboard();
        document.getElementById('addProductForm').reset();
        document.getElementById('previewContainer').innerHTML = `<span class="text-muted"><i class="fa-solid fa-camera fa-2x me-2"></i>ఫోటో ఇంకా ఎంచుకోలేదు</span>`;
        selectedImageBase64 = "";
      }
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up me-2"></i>ప్రొడక్ట్ పూర్తి వివరాలతో లైవ్ చేయండి`;
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/seller/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          phone: document.getElementById('loginPhone').value,
          password: document.getElementById('loginPass').value
        })
      });
      const data = await res.json();
      if(res.ok) {
        localStorage.setItem('meestore_seller', JSON.stringify(data));
        curSeller = data;
        loadDashboard();
      } else alert(data.error);
    };

    async function loadDashboard() {
      if(!curSeller) return;
      document.getElementById('authSection').classList.add('d-none');
      document.getElementById('dashboardSection').classList.remove('d-none');
      document.getElementById('welcomeShopName').innerText = curSeller.shop_name;

      const res = await fetch(`${API}/seller/dashboard/${curSeller.id}`);
      const data = await res.json();

      const tbl = document.getElementById('inventoryList');
      tbl.innerHTML = data.products.map(p => `
        <tr>
          <td><img src="${p.image_url}" style="width:45px; height:45px; object-fit:cover; border-radius:4px;"></td>
          <td><b>${p.name}</b></td>
          <td>${p.category}</td>
          <td>₹${p.price}</td>
          <td>${p.weight || 'N/A'}</td>
          <td><span class="badge bg-success">${p.stock}</span></td>
        </tr>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('meestore_seller');
      location.reload();
    }

    if(curSeller) loadDashboard();
  </script>
</body>
</html>
