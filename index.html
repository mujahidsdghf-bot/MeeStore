<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f8f9fa; padding-bottom: 70px; }

    /* Top Header */
    .header { background: white; padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { color: #9c27b0; font-weight: 800; font-size: 1.3rem; }
    
    /* Views */
    .view-container { display: none; padding: 14px; }
    .view-container.active { display: block; }

    /* Product Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; padding: 10px; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
    .title { font-size: 0.88rem; font-weight: bold; margin: 6px 0; color: #333; }
    .price { font-size: 1.1rem; font-weight: 800; color: #9c27b0; margin-bottom: 8px; }
    .btn { background: #9c27b0; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { background: none; border: none; font-size: 0.75rem; font-weight: bold; color: #666; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #9c27b0; }

    /* Form & Box */
    .box { background: white; padding: 16px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 12px; }
    .input { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand">🌸 MeeStore</div>
    <div>
      <button onclick="switchTab('cart', document.getElementById('navCart'))" style="background:#f3e5f5; border:1px solid #ce93d8; padding:6px 12px; border-radius:14px; color:#7b1fa2; font-weight:bold; cursor:pointer;">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- VIEW 1: HOME / PRODUCTS -->
  <div id="viewHome" class="view-container active">
    <div style="margin-bottom: 12px;">
      <input type="text" id="searchBox" class="input" placeholder="Search products..." oninput="filterProducts(this.value)">
    </div>
    <div class="grid" id="productGrid"></div>
  </div>

  <!-- VIEW 2: CATEGORIES -->
  <div id="viewCategories" class="view-container">
    <h3 style="color:#4a148c; margin-bottom:12px;">Categories</h3>
    <div style="background:white; padding:14px; border-radius:8px; border:1px solid #ddd; margin-bottom:8px; cursor:pointer;" onclick="filterCat('Women Fashion')">👗 Women Fashion</div>
    <div style="background:white; padding:14px; border-radius:8px; border:1px solid #ddd; margin-bottom:8px; cursor:pointer;" onclick="filterCat('Grocery & Millets')">🌾 Grocery & Millets</div>
    <div style="background:white; padding:14px; border-radius:8px; border:1px solid #ddd; margin-bottom:8px; cursor:pointer;" onclick="filterCat('Jewelry & Fancy')">💍 Jewelry & Fancy</div>
    <div style="background:white; padding:14px; border-radius:8px; border:1px solid #ddd; margin-bottom:8px; cursor:pointer;" onclick="filterCat('General & Pooja')">🪔 General & Pooja</div>
  </div>

  <!-- VIEW 3: SELLER HUB -->
  <div id="viewSeller" class="view-container">
    <div class="box">
      <h3 style="color:#9c27b0; margin-bottom:10px;">Seller Hub (Add Product)</h3>
      <input type="text" id="sName" class="input" placeholder="Product Name">
      <input type="number" id="sPrice" class="input" placeholder="Price (₹)">
      <input type="text" id="sImg" class="input" placeholder="Image URL (Unsplash link)">
      <button class="btn" onclick="addNewProduct()">Publish Product</button>
    </div>
  </div>

  <!-- VIEW 4: CART -->
  <div id="viewCart" class="view-container">
    <h3 style="color:#4a148c; margin-bottom:12px;">Shopping Cart</h3>
    <div id="cartItemsList"></div>
    <div id="cartTotalBox" style="display:none; margin-top:14px; background:white; padding:14px; border-radius:8px; border:1px solid #ddd;">
      <h3>Total: ₹<span id="cartSum">0</span></h3>
      <button class="btn" style="margin-top:10px; background:#16a34a;" onclick="checkoutWhatsApp()">Order via WhatsApp</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="navHome" onclick="switchTab('home', this)">🏠<span>Home</span></button>
    <button class="nav-item" id="navCat" onclick="switchTab('categories', this)">📂<span>Categories</span></button>
    <button class="nav-item" id="navSeller" onclick="switchTab('seller', this)">🏪<span>Seller Hub</span></button>
    <button class="nav-item" id="navCart" onclick="switchTab('cart', this)">🛒<span>Cart</span></button>
  </nav>

  <script>
    let cart = [];
    const baseProducts = [
      { id: 1, name: "Little millets (500g)", category: "Grocery & Millets", price: 20, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400" },
      { id: 2, name: "Soft Silk Saree", category: "Women Fashion", price: 499, img: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" },
      { id: 3, name: "Temple Necklace", category: "Jewelry & Fancy", price: 249, img: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400" },
      { id: 4, name: "Brass Diya", category: "General & Pooja", price: 120, img: "https://images.unsplash.com/photo-1605371924599-2d0365da1ae0?w=400" }
    ];

    function getProducts() {
      let custom = JSON.parse(localStorage.getItem('meestore_custom') || '[]');
      return [...custom, ...baseProducts];
    }

    function renderGrid(list) {
      const grid = document.getElementById('productGrid');
      const items = list || getProducts();
      grid.innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <div class="title">${p.name}</div>
          <div class="price">₹${p.price}</div>
          <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      if(tabName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        renderGrid();
      } else if(tabName === 'categories') {
        document.getElementById('viewCategories').classList.add('active');
      } else if(tabName === 'seller') {
        document.getElementById('viewSeller').classList.add('active');
      } else if(tabName === 'cart') {
        document.getElementById('viewCart').classList.add('active');
        renderCart();
      }
      if(btn) btn.classList.add('active');
      window.scrollTo(0,0);
    }

    function addToCart(id) {
      const prods = getProducts();
      const item = prods.find(p => p.id === id);
      if(item) {
        cart.push(item);
        document.getElementById('cartCount').innerText = cart.length;
        alert("🎉 " + item.name + " added to cart!");
      }
    }

    function renderCart() {
      const list = document.getElementById('cartItemsList');
      const box = document.getElementById('cartTotalBox');
      if(cart.length === 0) {
        list.innerHTML = "<p style='color:#777; text-align:center; padding:30px;'>Your cart is empty.</p>";
        box.style.display = 'none';
      } else {
        let sum = 0;
        list.innerHTML = cart.map((c, i) => {
          sum += c.price;
          return `<div style="background:white; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
            <span><b>${c.name}</b> - ₹${c.price}</span>
            <button onclick="cart.splice(${i},1); renderCart(); document.getElementById('cartCount').innerText=cart.length;" style="background:#ffebee; color:#c62828; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Remove</button>
          </div>`;
        }).join('');
        document.getElementById('cartSum').innerText = sum;
        box.style.display = 'block';
      }
    }

    function addNewProduct() {
      const name = document.getElementById('sName').value.trim();
      const price = Number(document.getElementById('sPrice').value);
      const img = document.getElementById('sImg').value.trim();
      if(!name || !price || !img) { alert("All fields required!"); return; }
      
      const newP = { id: Date.now(), name, category: "Grocery & Millets", price, img };
      let custom = JSON.parse(localStorage.getItem('meestore_custom') || '[]');
      custom.unshift(newP);
      localStorage.setItem('meestore_custom', JSON.stringify(custom));
      alert("Product published successfully!");
      document.getElementById('sName').value = '';
      document.getElementById('sPrice').value = '';
      document.getElementById('sImg').value = '';
      switchTab('home', document.getElementById('navHome'));
    }

    function filterCat(catName) {
      switchTab('home', document.getElementById('navHome'));
      const prods = getProducts();
      renderGrid(prods.filter(p => p.category === catName));
    }

    function filterProducts(q) {
      const prods = getProducts();
      renderGrid(prods.filter(p => p.name.toLowerCase().includes(q.toLowerCase())));
    }

    function checkoutWhatsApp() {
      const names = cart.map(c => c.name).join(', ');
      const total = cart.reduce((sum, c) => sum + c.price, 0);
      const msg = `🛒 *New Order from MeeStore*\nItems: ${names}\nTotal: ₹${total}`;
      window.open(`https://wa.me/919177411712?text=${encodeURIComponent(msg)}`);
    }

    // Initial Load
    renderGrid();
  </script>
</body>
</html>
