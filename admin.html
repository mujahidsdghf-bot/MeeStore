<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - అడ్మిన్ డ్యాష్‌బోర్డ్</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3 class="fw-bold mb-4 text-purple" style="color:#9c27b0;">MeeStore బిజినెస్ & టెక్నికల్ రిపోర్ట్</h3>
    <div class="row g-3">
      <div class="col-md-3">
        <div class="card p-3 shadow-sm border-0">
          <div class="text-muted small">మొత్తం సెల్లర్లు</div>
          <h2 class="fw-bold" id="adSellers">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 shadow-sm border-0">
          <div class="text-muted small">మొత్తం బిజినెస్ టర్నోవర్</div>
          <h2 class="fw-bold text-primary">₹<span id="adTurnover">0</span></h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 shadow-sm border-0">
          <div class="text-muted small">మీ 2% నికర లాభం (Admin Commission)</div>
          <h2 class="fw-bold text-success">₹<span id="adIncome">0</span></h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 shadow-sm border-0">
          <div class="text-muted small">టెక్నికల్ / రిటర్న్స్ నష్టం (Loss)</div>
          <h2 class="fw-bold text-danger">₹<span id="adLoss">0</span></h2>
        </div>
      </div>
    </div>
  </div>
  <script>
    fetch("https://meestore.onrender.com/api/admin/report")
      .then(r => r.json())
      .then(d => {
        document.getElementById('adSellers').innerText = d.total_sellers;
        document.getElementById('adTurnover').innerText = d.gross_turnover;
        document.getElementById('adIncome').innerText = d.admin_income_2_percent;
        document.getElementById('adLoss').innerText = d.technical_returns_loss;
      });
  </script>
</body>
</html>
