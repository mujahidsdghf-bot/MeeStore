<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeeStore - సెల్లర్ పోర్టల్</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f8fafc; padding: 20px; color: #1e293b; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { color: #8b1d9f; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    button { width: 100%; background: #8b1d9f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .home-link { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>MeeStore సెల్లర్ పోర్టల్</h2>
    <form id="productForm">
      <div class="form-group">
        <label>ఉత్పత్తి పేరు (Product Name)</label>
        <input type="text" id="pName" placeholder="ఉదా: ఆర్గానిక్ కొర్రలు (1kg)" required />
      </div>

      <div class="form-group">
        <label>కేటగిరీ</label>
        <select id="pCat">
          <option value="కిరాణా & మిల్లెట్స్">కిరాణా & మిల్లెట్స్</option>
          <option value="ఉమెన్ & గర్ల్స్">ఉమెన్ & గర్ల్స్</option>
          <option value="మెన్ & బాయ్స్">మెన్ & బాయ్స్</option>
        </select>
      </div>

      <div class="form-group">
        <label>అసలు ధర / MRP (₹)</label>
        <input type="number" id="pMrp" placeholder="ఉదా: 150" required />
      </div>

      <div class="form-group">
        <label>అమ్మకపు ధర / Selling Price (₹)</label>
        <input type="number" id="pPrice" placeholder="ఉదా: 100" required />
      </div>

      <div class="form-group">
        <label>ఫోటో లింక్ (Image URL)</label>
        <input type="url" id="pImg" placeholder="https://..." required />
      </div>

      <div class="form-group">
        <label>సెల్లర్ WhatsApp నంబర్ (ఆర్డర్స్ కోసం)</label>
        <input type="tel" id="sellerPhone" placeholder="ఉదా: 919876543210" required />
      </div>

      <div class="form-group">
        <label>సెల్లర్ UPI ID (డైరెక్ట్ పేమెంట్ కోసం)</label>
        <input type="text" id="sellerUpi" placeholder="ఉదా: 9963636575@ybl లేదా yourname@oksbi" required />
      </div>

      <button type="submit">ప్రొడక్ట్ లైవ్ చేయండి</button>
    </form>
    <a href="index.html" class="home-link">← స్టోర్ హోమ్‌పేజీకి వెళ్లండి</a>
  </div>

  <script>
    const API_URL = "https://meestore.onrender.com/api/products";

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        name: document.getElementById('pName').value,
        category: document.getElementById('pCat').value,
        mrp: document.getElementById('pMrp').value,
        price: document.getElementById('pPrice').value,
        image_url: document.getElementById('pImg').value,
        seller_phone: document.getElementById('sellerPhone').value,
        seller_upi: document.getElementById('sellerUpi').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("ఉత్పత్తి విజయవంతంగా లైవ్ అయ్యింది!");
          window.location.href = "index.html";
        } else {
          alert("ఎర్రర్ వచ్చింది, మళ్లీ ప్రయత్నించండి.");
        }
      } catch (err) {
        alert("సర్వర్‌తో కనెక్ట్ కాలేకపోయింది!");
      }
    });
  </script>
</body>
</html>
