<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MeeStore - Seller Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fff5f8; padding-bottom: 60px; }
    
    .header { background: #9c27b0; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(156, 39, 176, 0.2); }
    .header-title { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .btn-back-store { color: white; text-decoration: none; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.6); padding: 6px 14px; border-radius: 18px; font-weight: 600; background: rgba(255,255,255,0.1); }
    
    .card { background: white; border-radius: 12px; padding: 20px; margin: 16px; box-shadow: 0 2px 10px rgba(244, 143, 177, 0.25); border: 1px solid #f8bbd0; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; color: #4a148c; }
    .form-input, .form-select { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fffcfd; }
    .form-input:focus, .form-select:focus { border-color: #9c27b0; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    
    .preview-box { width: 100%; height: 180px; border: 2px dashed #ba68c8; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fafafa; overflow: hidden; margin-bottom: 8px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
    
    .btn-primary-action { background: #9c27b0; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 12px rgba(156, 39, 176, 0.3); }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 18px; }
    .auth-tab-btn { flex: 1; padding: 10px; border: 1px solid #f48fb1; background: white; border-radius: 8px; cursor: pointer; font-weight: 700; color: #666; font-size: 0.9rem; }
    .auth-tab-btn.active { background: #9c27b0; color: white; border-color: #9c27b0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title"><i class="fa-solid fa-store"></i> MeeStore Seller Hub</div>
    <a href="index.html" class="btn-back-store"><i class="fa-solid fa-arrow-left me-1"></i> Back to Store</a>
  </div>

  <!-- Seller Auth Section -->
  <div id="sellerAuthCard" class="card" style="max-width: 440px; margin: 24px auto;">
    <div class="auth-tabs">
      <button id="tabSellerLoginBtn" class="auth-tab-btn active" onclick="switchSellerAuth(true)">Sign In</button>
      <button id="tabSellerRegBtn" class="auth-tab-btn" onclick="switchSellerAuth(false)">New Seller (KYC)</button>
    </div>

    <!-- Sign In Form -->
    <form id="sellerLoginForm" onsubmit="onSellerLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label">Registered Mobile Number</label>
        <input type="tel" id="sellerLogPhone" class="form-input" placeholder="10-digit mobile number" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="sellerLogPass" class="form-input" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary-action">Sign In to Dashboard</button>
    </form>

    <!-- Registration with KYC Form -->
    <form id="sellerRegForm" style="display: none;" onsubmit="onSellerRegisterSubmit(event)">
      <div class="form-group">
        <label class="form-label">Shop / Brand Name</label>
        <input type="text" id="sellerRegShop" class="form-input" placeholder="e.g. Royal Fashion Store" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" id="sellerRegPhone" class="form-input" placeholder="10-digit mobile number" required>
      </div>
      <div class="form-group">
        <label class="form-label">Aadhaar Card Number (KYC Verification)</label>
        <input type="text" id="sellerRegAadhar" class="form-input" placeholder="12-digit Aadhaar number" maxlength="12" pattern="\d{12}" title="Must be 12 digits" required>
      </div>
      <div class="form-group">
        <label class="form-label">Seller UPI ID (For Direct Payments)</label>
        <input type="text" id="sellerRegUpi" class="form-input" placeholder="e.g. yourname@upi or mobile@ybl" required>
      </div>
      <div class="form-group">
        <label class="form-label">Create Password</label>
        <input type="password" id="sellerRegPass" class="form-input" placeholder="Choose secure password" required>
      </div>
      <button type="submit" class="btn-primary-action" style="background: #2e7d32;">
        <i class="fa-solid fa-id-card me-1"></i> Complete KYC Registration
      </button>
    </form>
  </div>

  <!-- Seller Dashboard -->
  <div id="sellerDashboardCard" style="display: none; max-width: 700px; margin: 16px auto;">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f8bbd0; padding-bottom: 10px;">
        <div>
          <h3 id="shopWelcomeTitle" style="font-size: 1.2rem; color: #4a148c; font-weight: 800;">Welcome, Seller!</h3>
          <p style="font-size: 0.8rem; color: #666;">Add products with complete specifications for express delivery</p>
        </div>
        <button onclick="sellerLogout()" style="background: #e53935; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.85rem;">Sign Out</button>
      </div>

      <form onsubmit="onAddProductSubmit(event)">
        <div class="form-group">
          <label class="form-label">Product Name</label>
          <input type="text" id="pName" class="form-input" placeholder="e.g. Kanchipuram Silk Saree / Organic Foxtail Millet" required>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="pCategory" class="form-select" onchange="toggleFoodFields(this.value)" required>
            <option value="Women Fashion">👗 Women Fashion</option>
            <option value="Grocery & Millets">🌾 Grocery & Millets (Food Items)</option>
            <option value="Jewelry & Fancy">💍 Jewelry & Fancy</option>
            <option value="General & Pooja">🪔 General & Pooja Items</option>
            <option value="Men Fashion">👕 Men Fashion</option>
            <option value="Footwear">👠 Footwear</option>
          </select>
        </div>

        <!-- Camera & Gallery Image Selector -->
        <div class="form-group">
          <label class="form-label">Product Image (Take Photo or Choose from Gallery)</label>
          <div class="preview-box" id="imagePreviewBox">
            <span style="color: #999; text-align: center;"><i class="fa-solid fa-camera fa-2x mb-1"></i><br>No image chosen yet</span>
          </div>
          <input type="file" id="pImgInput" accept="image/*" class="form-input" onchange="handleImageSelection(this)" required>
        </div>

        <div class="row">
          <div class="col form-group">
            <label class="form-label">Selling Price (₹)</label>
            <input type="number" id="pPrice" class="form-input" placeholder="Price" required>
          </div>
          <div class="col form-group">
            <label class="form-label">Available Stock</label>
            <input type="number" id="pStock" class="form-input" value="10" required>
          </div>
        </div>

        <!-- Logistics: Weight & Dimensions -->
        <div class="row">
          <div class="col form-group">
            <label class="form-label">Net Weight (e.g. 500g / 1kg)</label>
            <input type="text" id="pWeight" class="form-input" placeholder="e.g. 500g" required>
          </div>
          <div class="col form-group">
            <label class="form-label">Dimensions (L x W x H)</label>
            <input type="text" id="pDimensions" class="form-input" placeholder="e.g. 15x10x5 cm" required>
          </div>
        </div>

        <div class="row">
          <div class="col form-group">
            <label class="form-label">Material / Fabric</label>
            <input type="text" id="pMaterial" class="form-input" placeholder="e.g. Pure Cotton / Silk / Steel">
          </div>
          <div class="col form-group">
            <label class="form-label">Color</label>
            <input type="text" id="pColor" class="form-input" placeholder="e.g. Maroon / Pink / Gold">
          </div>
        </div>

        <!-- Material Nature / Hazard -->
        <div class="form-group">
          <label class="form-label">Material Nature / Hazard</label>
          <select id="pHazard" class="form-select">
            <option value="Non-Hazardous">Safe / Non-Hazardous (Regular Item)</option>
            <option value="Fragile">Fragile (Glass / Clay / Breakable)</option>
            <option value="Liquid">Liquid / Oil (Bottled Liquid)</option>
            <option value="Hazardous">Flammable / Hazardous (Dangerous)</option>
          </select>
        </div>

        <!-- Packaging Type -->
        <div class="form-group">
          <label class="form-label">Packaging Type</label>
          <select id="pPackaging" class="form-select">
            <option value="Corrugated Box">Corrugated Box (Hard Cardboard Box - High Safety)</option>
            <option value="Poly Bag / Flyer">Poly Bag / Flyer (Waterproof Plastic Courier Bag)</option>
            <option value="Bubble Wrap">Bubble Wrap (Shock Absorption Packaging)</option>
          </select>
        </div>

        <!-- Food Compliance: FSSAI & Expiry -->
        <div id="foodComplianceGroup" style="display: none; background: #fdfaf6; padding: 12px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #ffe0b2;">
          <div class="form-group">
            <label class="form-label" style="color: #2e7d32;"><i class="fa-solid fa-certificate me-1"></i> FSSAI Food License Number</label>
            <input type="text" id="pFssai" class="form-input" placeholder="14-digit FSSAI License Number">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label"><i class="fa-regular fa-calendar me-1"></i> Expiry / Best Before Date</label>
            <input type="date" id="pExpiry" class="form-input">
          </div>
        </div>

        <button type="submit" id="btnPublishProduct" class="btn-primary-action">
          <i class="fa-solid fa-cloud-arrow-up me-1"></i> Publish Product Live
        </button>
      </form>
    </div>
  </div>

  <script>
    const API = "https://meestore.onrender.com/api";
    let activeSeller = JSON.parse(localStorage.getItem('meestore_seller'));
    let base64ImageData = "";

    function switchSellerAuth(isLogin) {
      document.getElementById('sellerLoginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('sellerRegForm').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tabSellerLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabSellerRegBtn').classList.toggle('active', !isLogin);
    }

    function handleImageSelection(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64ImageData = e.target.result;
          document.getElementById('imagePreviewBox').innerHTML = `<img src="${base64ImageData}">`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function toggleFoodFields(category) {
      const isFood = category.includes('Grocery') || category.includes('Millets');
      document.getElementById('foodComplianceGroup').style.display = isFood ? 'block' : 'none';
    }

    async function onSellerLoginSubmit(e) {
      e.preventDefault();
      try {
        const res = await fetch(`${API}/seller/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            phone: document.getElementById('sellerLogPhone').value,
            password: document.getElementById('sellerLogPass').value
          })
        });
        const d = await res.json();
        if (res.ok) {
          localStorage.setItem('meestore_seller', JSON.stringify(d));
          activeSeller = d;
          displayDashboard();
        } else {
          alert(d.error || "Login failed! Please check credentials.");
        }
      } catch (err) {
        alert("Unable to connect to server. Please try again.");
      }
    }

    async function onSellerRegisterSubmit(e) {
      e.preventDefault();
      try {
        const res = await fetch(`${API}/seller/register`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            shop_name: document.getElementById('sellerRegShop').value,
            phone: document.getElementById('sellerRegPhone').value,
            aadhar: document.getElementById('sellerRegAadhar').value,
            upi_id: document.getElementById('sellerRegUpi').value,
            password: document.getElementById('sellerRegPass').value
          })
        });
        const d = await res.json();
        if (res.ok) {
          alert("🎉 Seller registered successfully with Aadhaar KYC! Please sign in.");
          switchSellerAuth(true);
        } else {
          alert(d.error || "Registration failed!");
        }
      } catch (err) {
        alert("Registration request could not be processed.");
      }
    }

    function displayDashboard() {
      if (!activeSeller) return;
      document.getElementById('sellerAuthCard').style.display = 'none';
      document.getElementById('sellerDashboardCard').style.display = 'block';
      document.getElementById('shopWelcomeTitle').innerText = `Welcome, ${activeSeller.shop_name}!`;
    }

    function sellerLogout() {
      localStorage.removeItem('meestore_seller');
      location.reload();
    }

    async function onAddProductSubmit(e) {
      e.preventDefault();
      if (!base64ImageData) {
        alert("Please select a product photo from camera or gallery!");
        return;
      }

      const btn = document.getElementById('btnPublishProduct');
      btn.disabled = true;
      btn.innerText = "Publishing Product...";

      const payload = {
        seller_id: activeSeller.id,
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        price: document.getElementById('pPrice').value,
        mrp: document.getElementById('pPrice').value,
        stock: document.getElementById('pStock').value,
        image_url: base64ImageData,
        seller_phone: activeSeller.phone,
        seller_upi: activeSeller.upi_id,
        weight: document.getElementById('pWeight').value,
        dimensions: document.getElementById('pDimensions').value,
        material: document.getElementById('pMaterial').value,
        color: document.getElementById('pColor').value,
        hazard_type: document.getElementById('pHazard').value,
        packaging: document.getElementById('pPackaging').value,
        fssai: document.getElementById('pFssai').value,
        expiry: document.getElementById('pExpiry').value
      };

      try {
        const res = await fetch(`${API}/products`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert("🎉 Product published live with full packaging and logistics details!");
          window.location.href = "index.html";
        } else {
          alert("Failed to save product on server.");
        }
      } catch (err) {
        alert("Error connecting to server. Please try again.");
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up me-1"></i> Publish Product Live`;
    }

    if (activeSeller) {
      displayDashboard();
    }
  </script>
</body>
</html>
