<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MeeStore - Seller Hub & Inventory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fff5f8; padding-bottom: 60px; }
    
    .header { background: #9c27b0; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(156, 39, 176, 0.2); }
    .header-title { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .btn-back-store { color: white; text-decoration: none; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.6); padding: 6px 14px; border-radius: 18px; font-weight: 600; background: rgba(255,255,255,0.1); }
    
    .card { background: white; border-radius: 12px; padding: 18px; margin: 14px; box-shadow: 0 2px 10px rgba(244, 143, 177, 0.25); border: 1px solid #f8bbd0; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: white; border-radius: 10px; padding: 14px; border: 1px solid #fce4ec; border-left: 4px solid #9c27b0; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
    .stat-title { font-size: 0.75rem; color: #666; font-weight: bold; }
    .stat-val { font-size: 1.35rem; font-weight: 800; color: #333; margin-top: 4px; }
    
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; color: #4a148c; }
    .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.92rem; outline: none; background: #fffcfd; }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }
    
    .preview-box { width: 100%; height: 160px; border: 2px dashed #ba68c8; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fafafa; overflow: hidden; margin-bottom: 8px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
    
    .btn-action { background: #9c27b0; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .auth-tab-btn { flex: 1; padding: 10px; border: 1px solid #f48fb1; background: white; border-radius: 8px; cursor: pointer; font-weight: 700; color: #666; font-size: 0.88rem; }
    .auth-tab-btn.active { background: #9c27b0; color: white; border-color: #9c27b0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title"><i class="fa-solid fa-boxes-stacked"></i> Seller Hub</div>
    <a href="index.html" class="btn-back-store"><i class="fa-solid fa-arrow-left me-1"></i> Store</a>
  </div>

  <!-- 1. Seller Login / Register Card -->
  <div id="sellerAuthCard" class="card" style="max-width: 440px; margin: 24px auto;">
    <div class="auth-tabs">
      <button id="tabSellerLoginBtn" class="auth-tab-btn active" onclick="switchSellerAuth(true)">Sign In</button>
      <button id="tabSellerRegBtn" class="auth-tab-btn" onclick="switchSellerAuth(false)">New Seller (KYC)</button>
    </div>

    <form id="sellerLoginForm" onsubmit="onSellerLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label">Registered Mobile Number</label>
        <input type="tel" id="sellerLogPhone" class="form-input" placeholder="10-digit mobile" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="sellerLogPass" class="form-input" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-action">Sign In to Inventory</button>
    </form>

    <form id="sellerRegForm" style="display: none;" onsubmit="onSellerRegisterSubmit(event)">
      <div class="form-group">
        <label class="form-label">Shop / Brand Name</label>
        <input type="text" id="sellerRegShop" class="form-input" placeholder="e.g. Organic Millet Store" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" id="sellerRegPhone" class="form-input" placeholder="10-digit mobile" required>
      </div>
      <div class="form-group">
        <label class="form-label">Aadhaar Card Number (KYC)</label>
        <input type="text" id="sellerRegAadhar" class="form-input" placeholder="12-digit Aadhaar" maxlength="12" pattern="\d{12}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Seller UPI ID</label>
        <input type="text" id="sellerRegUpi" class="form-input" placeholder="name@upi" required>
      </div>
      <div class="form-group">
        <label class="form-label">Create Password</label>
        <input type="password" id="sellerRegPass" class="form-input" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-action" style="background: #2e7d32;">Complete KYC Register</button>
    </form>
  </div>

  <!-- 2. Seller Inventory & Stock Dashboard -->
  <div id="sellerDashboardCard" style="display: none; max-width: 700px; margin: 14px auto;">
    
    <!-- Seller Info Banner -->
    <div class="card" style="margin-bottom: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 id="shopWelcomeTitle" style="font-size: 1.15rem; color: #4a148c; font-weight: 800;">Welcome, Seller!</h3>
          <small style="color: #666;">Store ID: #SLR-9177 | Active Verified</small>
        </div>
        <button onclick="sellerLogout()" style="background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700;">Sign Out</button>
      </div>
    </div>

    <!-- సెల్లర్ స్టాక్, అమ్మకాలు & రిటర్న్స్ రిపోర్ట్ -->
    <div class="stat-grid" style="padding: 0 14px;">
      <div class="stat-box" style="border-left-color: #2e7d32;">
        <div class="stat-title">అందుబాటులో ఉన్న స్టాక్ (In Stock)</div>
        <div class="stat-val" id="sellerStockCount" style="color: #2e7d32;">48 Units</div>
      </div>
      <div class="stat-box" style="border-left-color: #0288d1;">
        <div class="stat-title">అమ్ముడైన సరుకులు (Dispatched)</div>
        <div class="stat-val" style="color: #0288d1;">12 Orders</div>
      </div>
      <div class="stat-box" style="border-left-color: #d32f2f;">
        <div class="stat-title">కస్టమర్ రిటర్న్స్ (Returns)</div>
        <div class="stat-val" style="color: #d32f2f;">0 Returned</div>
      </div>
      <div class="stat-box" style="border-left-color: #f57c00;">
        <div class="stat-title">మొత్తం ఆదాయం (UPI Received)</div>
        <div class="stat-val" style="color: #f57c00;">₹ 3,420</div>
      </div>
    </div>

    <!-- కొత్త సరుకు యాడ్ చేసే ఫామ్ -->
    <div class="card">
      <h4 style="font-size: 1rem; color: #4a148c; margin-bottom: 14px; border-bottom: 2px solid #f8bbd0; padding-bottom: 6px;">
        <i class="fa-solid fa-plus-circle me-1"></i> Add New Stock Item
      </h4>

      <form onsubmit="onAddProductSubmit(event)">
        <div class="form-group">
          <label class="form-label">Product Name</label>
          <input type="text" id="pName" class="form-input" placeholder="e.g. Organic Foxtail Millets / Kanchi Silk Saree" required>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="pCategory" class="form-select" onchange="toggleFoodFields(this.value)" required>
            <option value="Women Fashion">👗 Women Fashion</option>
            <option value="Grocery & Millets">🌾 Grocery & Millets (Food Items)</option>
            <option value="Jewelry & Fancy">💍 Jewelry & Fancy</option>
            <option value="General & Pooja">🪔 General & Pooja Items</option>
            <option value="Men Fashion">👕 Men Fashion</option>
            <option value="Footwear">👠 Footwear</option>
          </select>
        </div>

        <!-- Camera Image Compression -->
        <div class="form-group">
          <label class="form-label">Product Photo (Camera or Gallery)</label>
          <div class="preview-box" id="imagePreviewBox">
            <span style="color: #999; text-align: center;"><i class="fa-solid fa-camera fa-2x mb-1"></i><br>No image selected</span>
          </div>
          <input type="file" id="pImgInput" accept="image/*" class="form-input" onchange="compressAndPreview(this)" required>
          <small id="imgStatusMsg" style="color: #2e7d32; font-weight: bold;"></small>
        </div>

        <div class="row">
          <div class="col form-group">
            <label class="form-label">Price (₹)</label>
            <input type="number" id="pPrice" class="form-input" placeholder="Selling Price" required>
          </div>
          <div class="col form-group">
            <label class="form-label">Stock Quantity (లభ్యత సంఖ్య)</label>
            <input type="number" id="pStock" class="form-input" value="20" placeholder="Available Quantity" required>
          </div>
        </div>

        <div class="row">
          <div class="col form-group">
            <label class="form-label">Net Weight (బరువు)</label>
            <input type="text" id="pWeight" class="form-input" placeholder="e.g. 500g / 1kg" required>
          </div>
          <div class="col form-group">
            <label class="form-label">Dimensions (L x W x H)</label>
            <input type="text" id="pDimensions" class="form-input" placeholder="e.g. 15x10x5 cm" required>
          </div>
        </div>

        <div class="row">
          <div class="col form-group">
            <label class="form-label">Material / Fabric</label>
            <input type="text" id="pMaterial" class="form-input" placeholder="e.g. Organic Grain / Cotton">
          </div>
          <div class="col form-group">
            <label class="form-label">Color</label>
            <input type="text" id="pColor" class="form-input" placeholder="e.g. Natural Brown / Pink">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Material Nature / Hazard (హానికరమా కాదా?)</label>
          <select id="pHazard" class="form-select">
            <option value="Non-Hazardous / Safe">Safe / Non-Hazardous (Regular Item)</option>
            <option value="Fragile">Fragile (Glass / Clay / Breakable)</option>
            <option value="Liquid">Liquid / Oil (Bottled)</option>
            <option value="Hazardous">Flammable / Dangerous</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Packaging Type (ప్యాకింగ్ రకం)</label>
          <select id="pPackaging" class="form-select">
            <option value="Corrugated Box">Corrugated Box (Hard Cardboard Box - High Safety)</option>
            <option value="Poly Bag / Flyer">Poly Bag / Flyer (Plastic Courier Bag)</option>
            <option value="Bubble Wrap">Bubble Wrap (Shock Absorption)</option>
          </select>
        </div>

        <div id="foodComplianceGroup" style="display: none; background: #fdfaf6; padding: 12px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #ffe0b2;">
          <div class="form-group">
            <label class="form-label" style="color: #2e7d32;"><i class="fa-solid fa-certificate me-1"></i> FSSAI Food License Number</label>
            <input type="text" id="pFssai" class="form-input" placeholder="14-digit FSSAI License">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label"><i class="fa-regular fa-calendar me-1"></i> Expiry Date</label>
            <input type="date" id="pExpiry" class="form-input">
          </div>
        </div>

        <button type="submit" id="btnPublishProduct" class="btn-action">
          <i class="fa-solid fa-cloud-arrow-up me-1"></i> Add to Live Store Inventory
        </button>
      </form>
    </div>
  </div>

  <script>
    const API = "https://meestore.onrender.com/api";
    let activeSeller = null;
    try {
      const s = localStorage.getItem('meestore_seller');
      if (s) activeSeller = JSON.parse(s);
    } catch(e) {}

    let compressedBase64Image = "";

    function switchSellerAuth(isLogin) {
      document.getElementById('sellerLoginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('sellerRegForm').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tabSellerLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabSellerRegBtn').classList.toggle('active', !isLogin);
    }

    function compressAndPreview(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        const status = document.getElementById('imgStatusMsg');
        status.innerText = "Compressing photo...";

        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let width = img.width, height = img.height;
            const maxDim = 500;

            if (width > height && width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            compressedBase64Image = canvas.toDataURL('image/jpeg', 0.70);
            document.getElementById('imagePreviewBox').innerHTML = `<img src="${compressedBase64Image}">`;
            status.innerText = "✓ Ready to upload!";
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleFoodFields(category) {
      const isFood = category.includes('Grocery') || category.includes('Millets');
      document.getElementById('foodComplianceGroup').style.display = isFood ? 'block' : 'none';
    }

    function onSellerLoginSubmit(e) {
      e.preventDefault();
      const ph = document.getElementById('sellerLogPhone').value.trim();
      activeSeller = { id: 1, shop_name: "My Seller Store", phone: ph, upi_id: "mujahidsdghf9@ybl" };
      localStorage.setItem('meestore_seller', JSON.stringify(activeSeller));
      displayDashboard();
    }

    function onSellerRegisterSubmit(e) {
      e.preventDefault();
      const sName = document.getElementById('sellerRegShop').value.trim();
      const ph = document.getElementById('sellerRegPhone').value.trim();
      const upi = document.getElementById('sellerRegUpi').value.trim();
      activeSeller = { id: 1, shop_name: sName, phone: ph, upi_id: upi };
      localStorage.setItem('meestore_seller', JSON.stringify(activeSeller));
      alert("🎉 Registered successfully with Aadhaar KYC!");
      displayDashboard();
    }

    function displayDashboard() {
      if (!activeSeller) return;
      document.getElementById('sellerAuthCard').style.display = 'none';
      document.getElementById('sellerDashboardCard').style.display = 'block';
      document.getElementById('shopWelcomeTitle').innerText = `Welcome, ${activeSeller.shop_name}!`;
    }

    function sellerLogout() {
      localStorage.removeItem('meestore_seller');
      location.reload();
    }

    function onAddProductSubmit(e) {
      e.preventDefault();
      if (!compressedBase64Image) {
        alert("Please select a product photo!");
        return;
      }

      const stockQty = Number(document.getElementById('pStock').value);
      const newProduct = {
        id: Date.now(),
        seller_id: activeSeller.id || 1,
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCategory').value,
        price: Number(document.getElementById('pPrice').value),
        stock: stockQty,
        image_url: compressedBase64Image,
        seller_phone: activeSeller.phone || "9177411712",
        seller_upi: activeSeller.upi_id || "mujahidsdghf9@ybl",
        weight: document.getElementById('pWeight').value.trim(),
        dimensions: document.getElementById('pDimensions').value.trim(),
        material: document.getElementById('pMaterial').value.trim() || "Standard",
        color: document.getElementById('pColor').value.trim() || "Standard",
        hazard: document.getElementById('pHazard').value,
        packaging: document.getElementById('pPackaging').value,
        fssai: document.getElementById('pFssai').value.trim() || "N/A",
        expiry: document.getElementById('pExpiry').value || "N/A"
      };

      try {
        let existing = [];
        const raw = localStorage.getItem('meestore_custom_products');
        if (raw) existing = JSON.parse(raw);
        existing.unshift(newProduct);
        localStorage.setItem('meestore_custom_products', JSON.stringify(existing));
      } catch(err) {}

      alert("🎉 Product successfully added to Store Inventory with " + stockQty + " stock units!");
      window.location.href = "index.html";
    }

    if (activeSeller) displayDashboard();
  </script>
</body>
</html>
