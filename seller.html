<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - సెల్లర్ పోర్టల్</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .header-bar { background-color: #9c27b0; color: white; padding: 15px; }
    .card-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="header-bar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-store me-2"></i>MeeStore Seller Hub</h5>
    <a href="index.html" class="btn btn-outline-light btn-sm">స్టోర్‌కి వెళ్లండి</a>
  </div>

  <div class="container my-4">
    <!-- లాగిన్/రిజిస్ట్రేషన్ సెక్షన్ -->
    <div id="authSection" class="row justify-content-center">
      <div class="col-md-5">
        <div class="card-box">
          <ul class="nav nav-pills nav-justified mb-3" id="pills-tab">
            <li class="nav-item"><button class="nav-link active" onclick="toggleAuth(true)">లాగిన్</button></li>
            <li class="nav-item"><button class="nav-link" onclick="toggleAuth(false)">కొత్త సెల్లర్ రిజిస్టర్</button></li>
          </ul>

          <form id="loginForm">
            <div class="mb-2"><input type="tel" id="loginPhone" class="form-control" placeholder="మొబైల్ నంబర్" required></div>
            <div class="mb-3"><input type="password" id="loginPass" class="form-control" placeholder="పాస్‌వర్డ్" required></div>
            <button type="submit" class="btn btn-primary w-100" style="background:#9c27b0; border:none;">లాగిన్ అవ్వండి</button>
          </form>

          <form id="regForm" class="d-none">
            <div class="mb-2"><input type="text" id="regShop" class="form-control" placeholder="దుకాణం / బ్రాండ్ పేరు" required></div>
            <div class="mb-2"><input type="tel" id="regPhone" class="form-control" placeholder="మొబైల్ నంబర్" required></div>
            <div class="mb-2"><input type="text" id="regUpi" class="form-control" placeholder="మీ UPI ID" required></div>
            <div class="mb-3"><input type="password" id="regPass" class="form-control" placeholder="పాస్‌వర్డ్" required></div>
            <button type="submit" class="btn btn-success w-100">ఖాతా సృష్టించండి</button>
          </form>
        </div>
      </div>
    </div>

    <!-- సెల్లర్ డ్యాష్‌బోర్డ్ -->
    <div id="dashboardSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-secondary" id="welcomeShopName">హలో సెల్లర్!</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">లాగౌట్</button>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
          <div class="card-box text-center">
            <div class="text-muted small">మొత్తం ఆదాయం (Net)</div>
            <h4 class="text-success fw-bold mt-1">₹<span id="dashEarnings">0</span></h4>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="card-box text-center">
            <div class="text-muted small">లైవ్ వస్తువులు</div>
            <h4 class="text-primary fw-bold mt-1"><span id="dashLiveItems">0</span></h4>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card-box text-center">
            <div class="text-muted small">రిటర్న్స్ & రీఫండ్స్</div>
            <h4 class="text-danger fw-bold mt-1"><span id="dashReturns">0</span></h4>
          </div>
        </div>
      </div>

      <!-- వస్తువును యాడ్ చేసే ఫారమ్ -->
      <div class="card-box mb-4">
        <h5 class="fw-bold mb-3">కొత్త ప్రొడక్ట్ జోడించండి</h5>
        <form id="addProductForm">
          <div class="row g-2">
            <div class="col-md-4"><input type="text" id="pName" class="form-control" placeholder="ఉత్పత్తి పేరు" required></div>
            <div class="col-md-4">
              <select id="pCategory" class="form-select" required>
                <option value="కిరాణా & మినరల్స్">🌾 కిరాణా & మినరల్స్</option>
                <option value="జనరల్ & పూజా స్టోర్">🪔 జనరల్ & పూజా స్టోర్</option>
                <option value="Women Fashion">👗 Women Fashion</option>
                <option value="Men Fashion">👕 Men Fashion</option>
                <option value="ఫ్యాన్సీ & జ్యువెలరీ">💍 ఫ్యాన్సీ & జ్యువెలరీ</option>
                <option value="ఫుట్‌వేర్">👠 ఫుట్‌వేర్</option>
                <option value="Home & Kitchen">🏠 Home & Kitchen</option>
                <option value="Beauty & Health">💄 Beauty & Health</option>
                <option value="Kids & Toys">👶 Kids & Toys</option>
                <option value="Electronics & Accessories">📱 Electronics</option>
                <option value="Bags & Luggage">👜 Bags & Luggage</option>
              </select>
            </div>
            <div class="col-md-2"><input type="number" id="pPrice" class="form-control" placeholder="ధర (₹)" required></div>
            <div class="col-md-2"><input type="number" id="pStock" class="form-control" placeholder="స్టాక్ (సంఖ్య)" value="10" required></div>
            <div class="col-md-8"><input type="url" id="pImg" class="form-control" placeholder="ఫోటో లింక్ URL" required></div>
            <div class="col-md-4"><button type="submit" class="btn btn-primary w-100" style="background:#9c27b0; border:none;">లైవ్ చేయండి</button></div>
          </div>
        </form>
      </div>

      <!-- సెల్లర్ సొంత వస్తువుల జాబితా -->
      <div class="card-box">
        <h5 class="fw-bold mb-3">మీ ఇన్వెంటరీ (వస్తువులు & స్టాక్)</h5>
        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th>పేరు</th>
                <th>కేటగిరీ</th>
                <th>ధర</th>
                <th>ప్రస్తుత స్టాక్</th>
              </tr>
            </thead>
            <tbody id="inventoryList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://meestore.onrender.com/api";
    let curSeller = JSON.parse(localStorage.getItem('meestore_seller'));

    function toggleAuth(isLogin) {
      document.getElementById('loginForm').classList.toggle('d-none', !isLogin);
      document.getElementById('regForm').classList.toggle('d-none', isLogin);
    }

    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/seller/register`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          shop_name: document.getElementById('regShop').value,
          phone: document.getElementById('regPhone').value,
          upi_id: document.getElementById('regUpi').value,
          password: document.getElementById('regPass').value
        })
      });
      const data = await res.json();
      if(res.ok) { alert("రిజిస్ట్రేషన్ పూర్తయింది! లాగిన్ అవ్వండి."); toggleAuth(true); }
      else alert(data.error);
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/seller/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          phone: document.getElementById('loginPhone').value,
          password: document.getElementById('loginPass').value
        })
      });
      const data = await res.json();
      if(res.ok) {
        localStorage.setItem('meestore_seller', JSON.stringify(data));
        curSeller = data;
        loadDashboard();
      } else alert(data.error);
    };

    async function loadDashboard() {
      if(!curSeller) return;
      document.getElementById('authSection').classList.add('d-none');
      document.getElementById('dashboardSection').classList.remove('d-none');
      document.getElementById('welcomeShopName').innerText = curSeller.shop_name;

      const res = await fetch(`${API}/seller/dashboard/${curSeller.id}`);
      const data = await res.json();
      document.getElementById('dashEarnings').innerText = data.total_payout;
      document.getElementById('dashLiveItems').innerText = data.products.length;
      document.getElementById('dashReturns').innerText = data.returns.length;

      const tbl = document.getElementById('inventoryList');
      tbl.innerHTML = data.products.map(p => `
        <tr>
          <td><b>${p.name}</b></td>
          <td>${p.category}</td>
          <td>₹${p.price}</td>
          <td><span class="badge bg-success">${p.stock} Units</span></td>
        </tr>
      `).join('');
    }

    document.getElementById('addProductForm').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/products`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          seller_id: curSeller.id,
          name: document.getElementById('pName').value,
          category: document.getElementById('pCategory').value,
          price: document.getElementById('pPrice').value,
          mrp: document.getElementById('pPrice').value,
          stock: document.getElementById('pStock').value,
          image_url: document.getElementById('pImg').value,
          seller_phone: curSeller.phone,
          seller_upi: curSeller.upi_id
        })
      });
      if(res.ok) { alert("ప్రొడక్ట్ లైవ్ అయ్యింది!"); loadDashboard(); }
    };

    function logout() {
      localStorage.removeItem('meestore_seller');
      location.reload();
    }

    if(curSeller) loadDashboard();
  </script>
</body>
  </html>
