<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - ఆన్‌లైన్ షాపింగ్</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f5f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar-brand { font-weight: 800; color: #9c27b0 !important; font-size: 1.4rem; }
    .cat-scroll { display: flex; overflow-x: auto; white-space: nowrap; gap: 8px; padding: 10px 0; -webkit-overflow-scrolling: touch; }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { border-radius: 20px; font-size: 0.85rem; padding: 6px 14px; border: 1px solid #e0e0e0; background: white; color: #333; }
    .cat-btn.active { background: #9c27b0; color: white; border-color: #9c27b0; font-weight: 600; }
    .product-card { border: none; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 100%; display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 190px; object-fit: cover; }
    .price-text { color: #9c27b0; font-weight: 700; font-size: 1.15rem; }
    .mrp-text { text-decoration: line-through; color: #888; font-size: 0.85rem; }
    .btn-buy { background: #9c27b0; color: white; border: none; font-size: 0.9rem; font-weight: 600; }
    .btn-buy:hover { background: #7b1fa2; color: white; }
    .btn-upi-app { background: #1b8755; color: white; font-weight: 600; border-radius: 8px; padding: 12px; text-decoration: none; display: block; text-align: center; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .btn-upi-app:hover { background: #146c43; color: white; }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand bg-white sticky-top border-bottom py-2">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-bag-shopping me-1"></i>MeeStore</a>
      <div class="d-flex align-items-center gap-2">
        <a href="seller.html" class="btn btn-outline-primary btn-sm rounded-pill"><i class="fa-solid fa-store me-1"></i>సెల్లర్ అవ్వండి</a>
        <button class="btn btn-light position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer">
          <i class="fa-solid fa-cart-shopping fs-5"></i>
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Search & All Categories -->
  <div class="container mt-2">
    <div class="input-group mb-2 shadow-sm rounded-pill overflow-hidden">
      <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
      <input type="text" id="searchInput" class="form-control border-start-0" placeholder="వస్తువులను వెతకండి...">
    </div>

    <!-- పూర్తి కేటగిరీ బటన్లు -->
    <div class="cat-scroll">
      <button class="cat-btn active" onclick="filterCat('all', this)">అన్నీ (All)</button>
      <button class="cat-btn" onclick="filterCat('కిరాణా & మినరల్స్', this)">🌾 కిరాణా & మినరల్స్</button>
      <button class="cat-btn" onclick="filterCat('జనరల్ & పూజా స్టోర్', this)">🪔 జనరల్ & పూజా స్టోర్</button>
      <button class="cat-btn" onclick="filterCat('Women Fashion', this)">👗 Women Fashion</button>
      <button class="cat-btn" onclick="filterCat('Men Fashion', this)">👕 Men Fashion</button>
      <button class="cat-btn" onclick="filterCat('ఫ్యాన్సీ & జ్యువెలరీ', this)">💍 ఫ్యాన్సీ & జ్యువెలరీ</button>
      <button class="cat-btn" onclick="filterCat('ఫుట్‌వేర్', this)">👠 ఫుట్‌వేర్</button>
      <button class="cat-btn" onclick="filterCat('Home & Kitchen', this)">🏠 Home & Kitchen</button>
      <button class="cat-btn" onclick="filterCat('Beauty & Health', this)">💄 Beauty & Health</button>
      <button class="cat-btn" onclick="filterCat('Kids & Toys', this)">👶 Kids & Toys</button>
      <button class="cat-btn" onclick="filterCat('Electronics & Accessories', this)">📱 Electronics</button>
      <button class="cat-btn" onclick="filterCat('Bags & Luggage', this)">👜 Bags & Luggage</button>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="container my-3">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-2">ఉత్పత్తులు లోడ్ అవుతున్నాయి...</p>
    </div>
    <div id="emptyMsg" class="text-center py-5 text-muted d-none">
      <i class="fa-solid fa-box-open fa-3x mb-3 text-secondary"></i>
      <h5>ఈ కేటగిరీలో ఉత్పత్తులు ఏవీ లేవు</h5>
    </div>
    <div id="productGrid" class="row row-cols-2 row-cols-md-4 g-3"></div>
  </div>

  <!-- Cart & Checkout Offcanvas -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartDrawer">
    <div class="offcanvas-header bg-light border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="fa-solid fa-cart-arrow-down me-2"></i>మీ కార్ట్</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="cartItemsList" class="mb-3"></div>
      
      <div id="checkoutFormArea" class="d-none">
        <h6 class="fw-bold mt-3 mb-2 border-bottom pb-1">డెలివరీ చిరునామా</h6>
        <div class="mb-2">
          <input type="text" id="custName" class="form-control form-control-sm" placeholder="మీ పూర్తి పేరు" required>
        </div>
        <div class="mb-2">
          <input type="tel" id="custPhone" class="form-control form-control-sm" placeholder="మొబైల్ నంబర్" required>
        </div>
        <div class="mb-3">
          <textarea id="custAddress" class="form-control form-control-sm" rows="2" placeholder="ఇంటి నంబర్, వీధి, ఏరియా, పిన్‌కోడ్" required></textarea>
        </div>

        <h6 class="fw-bold mb-2 border-bottom pb-1">పేమెంట్ విధానం</h6>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payMethod" id="payPrepaid" value="prepaid" checked onchange="togglePayView()">
          <label class="form-check-label fw-bold" for="payPrepaid">Prepaid (UPI / GPay / PhonePe)</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="radio" name="payMethod" id="payCod" value="cod" onchange="togglePayView()">
          <label class="form-check-label" for="payCod">క్యాష్ ఆన్ డెలివరీ (COD)</label>
        </div>

        <!-- Direct UPI & QR Display Area -->
        <div id="upiPaymentSection" class="p-3 bg-light rounded text-center border mb-3">
          <p class="small text-muted mb-2 fw-bold">మొబైల్ యాప్ ద్వారా పేమెంట్ చేయడానికి:</p>
          <a id="btnDirectUpi" href="#" class="btn-upi-app">
            <i class="fa-solid fa-mobile-screen-button me-2"></i>Pay via GPay / PhonePe / Paytm
          </a>
          
          <div class="text-muted small my-2">- లేదా స్కానర్ కోసం -</div>
          <img id="qrImage" src="" alt="UPI QR" class="img-fluid rounded border p-1 bg-white mb-2" style="max-width: 150px;">
          <p class="small text-muted mb-0">UPI ID: <span id="upiIdDisplay" class="fw-bold text-dark"></span></p>
        </div>

        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>మొత్తం బిల్లు:</span>
          <span class="text-primary">₹<span id="cartTotal">0</span></span>
        </div>

        <button class="btn btn-success w-100 py-2 fw-bold" onclick="sendOrderToWhatsApp()">
          <i class="fa-brands fa-whatsapp me-2 fs-5"></i>ఆర్డర్ కన్ఫర్మ్ చేసి పంపండి
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = "https://meestore.onrender.com";
    let allProducts = [];
    let cart = [];

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products`);
        allProducts = await res.json();
        document.getElementById('loading').classList.add('d-none');
        renderProducts(allProducts);
      } catch (err) {
        document.getElementById('loading').innerHTML = '<span class="text-danger fw-bold">ఉత్పత్తులు లోడ్ కాలేదు. దయచేసి రీఫ్రెష్ చేయండి.</span>';
      }
    }

    function renderProducts(list) {
      const grid = document.getElementById('productGrid');
      const emptyMsg = document.getElementById('emptyMsg');
      grid.innerHTML = "";

      if (!list || list.length === 0) {
        emptyMsg.classList.remove('d-none');
        return;
      }
      emptyMsg.classList.add('d-none');

      list.forEach(p => {
        const col = document.createElement('div');
        col.className = 'col';
        col.innerHTML = `
          <div class="product-card">
            <img src="${p.image_url}" class="product-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            <div class="p-3 d-flex flex-column flex-grow-1">
              <span class="badge bg-light text-secondary mb-1 align-self-start" style="font-size: 0.7rem;">${p.category || 'General'}</span>
              <h6 class="fw-bold mb-1 text-truncate" title="${p.name}">${p.name}</h6>
              <div class="mb-3">
                <span class="price-text">₹${p.price}</span>
                ${p.mrp ? `<span class="mrp-text ms-2">₹${p.mrp}</span>` : ''}
              </div>
              <button class="btn btn-buy w-100 mt-auto rounded-pill" onclick="addToCart(${p.id})">
                <i class="fa-solid fa-cart-plus me-1"></i>కొనండి
              </button>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });
    }

    function filterCat(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (category === 'all') {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.category && p.category.toLowerCase().includes(q)));
      renderProducts(filtered);
    });

    function addToCart(productId) {
      const item = allProducts.find(p => p.id === productId);
      if (!item) return;
      cart.push(item);
      updateCartUI();
      const offcanvas = new bootstrap.Offcanvas(document.getElementById('cartDrawer'));
      offcanvas.show();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const listArea = document.getElementById('cartItemsList');
      const formArea = document.getElementById('checkoutFormArea');
      listArea.innerHTML = "";

      if (cart.length === 0) {
        listArea.innerHTML = '<p class="text-center text-muted py-4">మీ కార్ట్ ఖాళీగా ఉంది</p>';
        formArea.classList.add('d-none');
        return;
      }

      formArea.classList.remove('d-none');
      let total = 0;
      cart.forEach((item, idx) => {
        total += Number(item.price);
        listArea.innerHTML += `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <div class="fw-bold">${item.name}</div>
              <div class="text-muted small">₹${item.price}</div>
            </div>
            <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = total;
      setupDirectUpi(total);
    }

    function togglePayView() {
      const isPrepaid = document.getElementById('payPrepaid').checked;
      document.getElementById('upiPaymentSection').style.display = isPrepaid ? 'block' : 'none';
    }

    function setupDirectUpi(amount) {
      const firstItem = cart[0];
      const upiId = (firstItem && firstItem.seller_upi) ? firstItem.seller_upi : 'mujahidsdghf9@ybl';
      const storeName = "MeeStore Order";
      
      const upiDeepLink = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(storeName)}&am=${amount}&cu=INR`;
      document.getElementById('btnDirectUpi').setAttribute('href', upiDeepLink);

      const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiDeepLink)}`;
      document.getElementById('qrImage').src = qrApi;
      document.getElementById('upiIdDisplay').innerText = upiId;
    }

    function sendOrderToWhatsApp() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert("దయచేసి పేరు, ఫోన్ నంబర్ మరియు పూర్తి చిరునామా ఎంటర్ చేయండి.");
        return;
      }

      const isPrepaid = document.getElementById('payPrepaid').checked;
      const payMode = isPrepaid ? "Prepaid (UPI పేమెంట్ పూర్తయింది, స్క్రీన్‌షాట్ జతచేస్తున్నాను)" : "Cash on Delivery (COD)";
      const total = document.getElementById('cartTotal').innerText;

      let itemsText = "";
      cart.forEach((it, i) => {
        itemsText += `${i + 1}. ${it.name} - ₹${it.price}\n`;
      });

      const message = `🛒 *కొత్త MeeStore ఆర్డర్!*\n\n` +
                      `👤 *కస్టమర్:* ${name} (${phone})\n` +
                      `📍 *అడ్రస్:* ${address}\n` +
                      `💳 *పేమెంట్ విధానం:* ${payMode}\n\n` +
                      `📦 *ఆర్డర్ చేసిన వస్తువులు:*\n${itemsText}\n` +
                      `💰 *మొత్తం బిల్లు:* ₹${total}`;

      const sellerPhone = (cart[0] && cart[0].seller_phone) ? cart[0].seller_phone : '9177411712';
      const waUrl = `https://wa.me/91${sellerPhone}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
