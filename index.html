<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - ఆన్‌లైన్ షాపింగ్</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans pb-24">

  <!-- 1. హెడర్ & సెర్చ్ బార్ -->
  <header class="sticky top-0 z-50 bg-[#9c27b0] text-white p-3 shadow-md">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-bag-shopping text-2xl text-yellow-300"></i>
        <span class="text-xl font-bold tracking-wide">MeeStore</span>
      </div>
      <div class="flex items-center space-x-3">
        <a href="seller.html" class="bg-purple-900 border border-yellow-300 text-yellow-300 text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
          <i class="fa-solid fa-store"></i> సెల్లర్ అవ్వండి
        </a>
        <button onclick="openCart()" class="relative p-1">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cart-badge" class="absolute -top-1 -right-2 bg-yellow-400 text-black text-xs font-extrabold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </div>
    <!-- సెర్చ్ బాక్స్ -->
    <div class="relative">
      <input type="text" id="search-box" onkeyup="filterProducts()" placeholder="చీరలు, కుర్తీలు, కిరాణా లేదా బ్రాండ్స్ వెతకండి..." class="w-full pl-10 pr-4 py-2 rounded-lg text-gray-800 text-xs focus:outline-none bg-white shadow-inner">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
    </div>
  </header>

  <!-- 2. కేటగిరీల స్క్రోలర్ -->
  <section class="bg-white py-3 border-b shadow-sm">
    <div class="flex space-x-4 overflow-x-auto no-scrollbar px-3 text-center">
      <div onclick="selectCategory('all')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-pink-100 rounded-full flex items-center justify-center text-[#9c27b0] text-base font-bold border border-[#9c27b0]">
          <i class="fa-solid fa-border-all"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">అన్నీ</span>
      </div>
      <div onclick="selectCategory('women')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-pink-50 rounded-full flex items-center justify-center text-pink-600 text-base border border-pink-200">
          <i class="fa-solid fa-person-dress"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">ఉమెన్ & గర్ల్స్</span>
      </div>
      <div onclick="selectCategory('men')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 text-base border border-blue-200">
          <i class="fa-solid fa-person"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">మెన్ & బాయ్స్</span>
      </div>
      <div onclick="selectCategory('kids')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-yellow-50 rounded-full flex items-center justify-center text-yellow-600 text-base border border-yellow-200">
          <i class="fa-solid fa-baby"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">కిడ్స్ వేర్</span>
      </div>
      <div onclick="selectCategory('grocery')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-green-50 rounded-full flex items-center justify-center text-green-600 text-base border border-green-200">
          <i class="fa-solid fa-wheat-awn"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">కిరాణా & మిల్లెట్స్</span>
      </div>
      <div onclick="selectCategory('home')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-orange-50 rounded-full flex items-center justify-center text-orange-600 text-base border border-orange-200">
          <i class="fa-solid fa-kitchen-set"></i>
        </div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">హోమ్ & కిచెన్</span>
      </div>
    </div>
  </section>

  <!-- 3. ఆఫర్ బ్యానర్ -->
  <section class="p-3">
    <div class="bg-gradient-to-r from-purple-700 to-indigo-600 rounded-xl p-3.5 text-white shadow flex justify-between items-center">
      <div>
        <span class="bg-yellow-400 text-purple-900 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">స్పెషల్ సేల్</span>
        <h2 class="text-base font-bold mt-1">హోల్‌సేల్ ధరలకే షాపింగ్!</h2>
        <p class="text-[11px] text-purple-100">ఉచిత డెలివరీ & సులభమైన రిటర్న్స్</p>
      </div>
      <i class="fa-solid fa-tags text-3xl text-yellow-300 pr-2"></i>
    </div>
  </section>

  <!-- 4. ప్రొడక్ట్స్ గ్రిడ్ -->
  <main class="px-3">
    <div class="flex justify-between items-center mb-2">
      <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">పాపులర్ ఉత్పత్తులు</h3>
      <button onclick="fetchLiveProducts()" class="text-[11px] text-[#9c27b0] font-bold flex items-center gap-1">
        <i class="fa-solid fa-rotate-right"></i> రిఫ్రెష్
      </button>
    </div>
    <div id="product-grid" class="grid grid-cols-2 gap-2.5">
      <p class="col-span-2 text-center text-xs text-gray-400 py-8">ఉత్పత్తులు లోడ్ అవుతున్నాయి...</p>
    </div>
  </main>

  <!-- 5. కార్ట్ మోడల్ -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 flex justify-end hidden">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h2 class="text-base font-bold text-gray-800">మీ కార్ట్ (<span id="cart-count">0</span>)</h2>
        <button onclick="closeCart()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>
      
      <div id="cart-items" class="flex-1 overflow-y-auto py-3 space-y-3 no-scrollbar"></div>
      
      <div class="border-t pt-3 space-y-2">
        <div class="flex justify-between text-sm font-bold text-gray-800">
          <span>మొత్తం బిల్లు:</span>
          <span class="text-[#9c27b0]">₹<span id="cart-total">0</span></span>
        </div>
        <button onclick="checkoutOrder()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-sm shadow hover:bg-green-700 flex items-center justify-center space-x-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>ఆర్డర్ కన్ఫర్మ్ చేయండి</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 6. బాటమ్ నావిగేషన్ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-40 text-gray-600 text-[11px]">
    <button onclick="selectCategory('all')" class="flex flex-col items-center text-[#9c27b0]">
      <i class="fa-solid fa-house text-base"></i>
      <span class="mt-0.5 font-semibold">హోమ్</span>
    </button>
    <button onclick="document.getElementById('search-box').focus()" class="flex flex-col items-center hover:text-[#9c27b0]">
      <i class="fa-solid fa-magnifying-glass text-base"></i>
      <span class="mt-0.5">సెర్చ్</span>
    </button>
    <a href="seller.html" class="flex flex-col items-center hover:text-[#9c27b0]">
      <i class="fa-solid fa-store text-base"></i>
      <span class="mt-0.5">సెల్లర్</span>
    </a>
    <button onclick="openCart()" class="flex flex-col items-center hover:text-[#9c27b0] relative">
      <i class="fa-solid fa-cart-shopping text-base"></i>
      <span class="mt-0.5">కార్ట్</span>
    </button>
  </nav>

  <!-- స్క్రిప్ట్ లాజిక్ -->
  <script>
    const API_URL = "https://meestore-uxnm.onrender.com/api/products";
    let allProducts = [];
    let cart = [];

    async function fetchLiveProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">సర్వర్ నుండి లోడ్ అవుతోంది...</p>`;
      
      try {
        const res = await fetch(API_URL);
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (err) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-8">డేటాబేస్ లోడ్ కాలేదు. దయచేసి కాసేపటి తర్వాత మళ్లీ ప్రయత్నించండి.</p>`;
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      if(!items || items.length === 0) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">ఉత్పత్తులు ఏమీ లేవు. సెల్లర్ పోర్టల్ నుండి జోడించండి.</p>`;
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col justify-between border border-gray-200">
          <img src="${p.image}" alt="${p.title}" class="w-full h-36 object-cover" onerror="this.src='https://placehold.co/400x300?text=Product'">
          <div class="p-2 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${p.title}</h4>
              <div class="flex items-center space-x-1 mt-1">
                <span class="text-sm font-bold text-gray-900">₹${p.price}</span>
                <span class="text-[10px] text-gray-400 line-through">₹${p.mrp}</span>
                <span class="text-[10px] text-green-600 font-bold">${Math.round(((p.mrp - p.price)/p.mrp)*100)}% off</span>
              </div>
            </div>
            <button onclick="addToCart(${p.id})" class="mt-2.5 w-full bg-[#9c27b0] text-white text-xs font-bold py-1.5 rounded hover:bg-purple-800 transition">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function selectCategory(cat) {
      if (cat === 'all') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function filterProducts() {
      const query = document.getElementById("search-box").value.toLowerCase();
      renderProducts(allProducts.filter(p => p.title.toLowerCase().includes(query)));
    }

    function addToCart(id) {
      const item = allProducts.find(p => p.id === id);
      if (item) {
        cart.push(item);
        updateCartBadge();
      }
    }

    function updateCartBadge() {
      const badge = document.getElementById("cart-badge");
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function openCart() {
      const modal = document.getElementById("cart-modal");
      const list = document.getElementById("cart-items");
      const totalEl = document.getElementById("cart-total");
      const countEl = document.getElementById("cart-count");

      countEl.innerText = cart.length;
      let total = 0;
      
      if (cart.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">మీ కార్ట్ ఖాళీగా ఉంది.</p>`;
      } else {
        list.innerHTML = cart.map((item, idx) => {
          total += Number(item.price);
          return `
            <div class="flex items-center justify-between border-b pb-2">
              <img src="${item.image}" class="w-12 h-12 object-cover rounded border" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
              <div class="flex-1 px-2">
                <p class="text-xs font-semibold text-gray-800 line-clamp-1">${item.title}</p>
                <p class="text-xs font-bold text-gray-900">₹${item.price}</p>
              </div>
              <button onclick="removeItem(${idx})" class="text-red-500 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        }).join('');
      }

      totalEl.innerText = total;
      modal.classList.remove("hidden");
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      openCart();
      updateCartBadge();
    }

    function closeCart() {
      document.getElementById("cart-modal").classList.add("hidden");
    }

    function checkoutOrder() {
      if (cart.length === 0) return alert("దయచేసి ముందుగా ఏదైనా వస్తువును కార్ట్‌కు జోడించండి!");
      let summary = "నమస్కారం! నేను MeeStore లో ఈ ఆర్డర్ చేయాలనుకుంటున్నాను:%0A%0A";
      let total = 0;
      cart.forEach((i, n) => {
        summary += `${n+1}. ${i.title} - ₹${i.price}%0A`;
        total += Number(i.price);
      });
      summary += `%0Aమొత్తం బిల్లు: ₹${total}%0Aదయచేసి డెలివరీ ప్రాసెస్ చేయగలరు.`;
      
      // మీ వాట్సాప్ నంబర్‌ను ఇక్కడ సెట్ చేయండి (ఉదా: 919876543210)
      window.open(`https://wa.me/919999999999?text=${summary}`, '_blank');
    }

    // మొదటిసారి సర్వర్ నుండి డేటాను లోడ్ చేయడం
    fetchLiveProducts();
  </script>
</body>
</html>
