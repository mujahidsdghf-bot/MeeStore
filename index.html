  <!-- స్క్రిప్ట్ లాజిక్ (హైబ్రిడ్ ఫాల్‌బ్యాక్ సిస్టమ్) -->
  <script>
    const API_URL = "https://meestore-uxnm.onrender.com/api/products";
    
    // 1. స్థిరమైన క్యాటలాగ్ (సర్వర్ స్లీప్‌లో ఉన్నా ఇవి ఎప్పుడూ లైవ్‌లో కనిపిస్తాయి)
    const initialProducts = [
      {
        id: 1,
        title: "కాటన్ ప్రింటెడ్ కుర్తీ",
        category: "women",
        price: 349,
        mrp: 799,
        image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=400"
      },
      {
        id: 2,
        title: "ఆర్గానిక్ కొర్రలు / Foxtail Millets (1kg)",
        category: "grocery",
        price: 140,
        mrp: 200,
        image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"
      },
      {
        id: 3,
        title: "మెన్స్ కాటన్ క్యాజువల్ షర్ట్",
        category: "men",
        price: 499,
        mrp: 1199,
        image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"
      },
      {
        id: 4,
        title: "కిడ్స్ పార్టీ వేర్ సెట్",
        category: "kids",
        price: 399,
        mrp: 899,
        image: "https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?w=400"
      },
      {
        id: 5,
        title: "నాన్-స్టిక్ దోశ పాన్",
        category: "home",
        price: 549,
        mrp: 1299,
        image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=400"
      },
      {
        id: 6,
        title: "ప్యూర్ సిల్క్ చీర",
        category: "women",
        price: 899,
        mrp: 2499,
        image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"
      }
    ];

    let allProducts = [...initialProducts];
    let cart = [];

    // 2. సర్వర్ & లోకల్ ఉత్పత్తులను లోడ్ చేసే విధానం
    async function fetchLiveProducts() {
      // ముందుగా మన 6 ఉత్పత్తులతో పాటు లోకల్ సెల్లర్ డేటాను వెంటనే స్క్రీన్‌పై చూపిస్తుంది
      const localSellerData = JSON.parse(localStorage.getItem('m_seller_products')) || [];
      allProducts = [...localSellerData, ...initialProducts];
      renderProducts(allProducts);

      // సర్వర్ నుండి లైవ్ ప్రొడక్ట్స్ తెచ్చే ప్రయత్నం
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000); // 6 సెకన్ల టైమౌట్

        const res = await fetch(API_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const serverProducts = await res.json();
        if (serverProducts && serverProducts.length > 0) {
          // సర్వర్ ఉత్పత్తులు + మన ఉత్పత్తులు కలిపి ప్రదర్శిస్తుంది
          allProducts = [...serverProducts, ...initialProducts];
          renderProducts(allProducts);
        }
      } catch (err) {
        // సర్వర్ నిద్రపోతున్నా ఎర్రర్ రానీయకుండా క్యాటలాగ్ ప్రొడక్ట్స్ చూపిస్తూనే ఉంటుంది
        console.log("Using instant fallback catalog:", err.message);
      }
    }

    // 3. స్క్రీన్‌పై ఉత్పత్తులను రెండర్ చేయడం
    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      if(!items || items.length === 0) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">ఉత్పత్తులు ఏమీ లేవు.</p>`;
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col justify-between border border-gray-200">
          <img src="${p.image}" alt="${p.title}" class="w-full h-36 object-cover" onerror="this.src='https://placehold.co/400x300?text=Product'">
          <div class="p-2 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${p.title}</h4>
              <div class="flex items-center space-x-1 mt-1">
                <span class="text-sm font-bold text-gray-900">₹${p.price}</span>
                <span class="text-[10px] text-gray-400 line-through">₹${p.mrp}</span>
                <span class="text-[10px] text-green-600 font-bold">${Math.round(((p.mrp - p.price)/p.mrp)*100)}% off</span>
              </div>
            </div>
            <button onclick="addToCart(${p.id})" class="mt-2.5 w-full bg-[#9c27b0] text-white text-xs font-bold py-1.5 rounded hover:bg-purple-800 transition">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function selectCategory(cat) {
      if (cat === 'all') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function filterProducts() {
      const query = document.getElementById("search-box").value.toLowerCase();
      renderProducts(allProducts.filter(p => p.title.toLowerCase().includes(query)));
    }

    function addToCart(id) {
      const item = allProducts.find(p => p.id === id);
      if (item) {
        cart.push(item);
        updateCartBadge();
      }
    }

    function updateCartBadge() {
      const badge = document.getElementById("cart-badge");
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function openCart() {
      const modal = document.getElementById("cart-modal");
      const list = document.getElementById("cart-items");
      const totalEl = document.getElementById("cart-total");
      const countEl = document.getElementById("cart-count");

      countEl.innerText = cart.length;
      let total = 0;
      
      if (cart.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">మీ కార్ట్ ఖాళీగా ఉంది.</p>`;
      } else {
        list.innerHTML = cart.map((item, idx) => {
          total += Number(item.price);
          return `
            <div class="flex items-center justify-between border-b pb-2">
              <img src="${item.image}" class="w-12 h-12 object-cover rounded border" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
              <div class="flex-1 px-2">
                <p class="text-xs font-semibold text-gray-800 line-clamp-1">${item.title}</p>
                <p class="text-xs font-bold text-gray-900">₹${item.price}</p>
              </div>
              <button onclick="removeItem(${idx})" class="text-red-500 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        }).join('');
      }

      totalEl.innerText = total;
      modal.classList.remove("hidden");
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      openCart();
      updateCartBadge();
    }

    function closeCart() {
      document.getElementById("cart-modal").classList.add("hidden");
    }

    function checkoutOrder() {
      if (cart.length === 0) return alert("దయచేసి ముందుగా ఏదైనా వస్తువును కార్ట్‌కు జోడించండి!");
      let summary = "నమస్కారం! నేను MeeStore లో ఈ ఆర్డర్ చేయాలనుకుంటున్నాను:%0A%0A";
      let total = 0;
      cart.forEach((i, n) => {
        summary += `${n+1}. ${i.title} - ₹${i.price}%0A`;
        total += Number(i.price);
      });
      summary += `%0Aమొత్తం బిల్లు: ₹${total}%0Aదయచేసి డెలివరీ వివరాలు పంపగలరు.`;
      
      window.open(`https://wa.me/919999999999?text=${summary}`, '_blank');
    }

    // పేజీ లోడ్ అవ్వగానే రన్ చేయడం
    fetchLiveProducts();
  </script>
