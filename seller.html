<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - సెల్లర్ పోర్టల్</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 font-sans pb-16">

  <!-- 1. సెల్లర్ హెడర్ -->
  <header class="bg-[#9c27b0] text-white p-3.5 shadow-md flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-2.5">
      <a href="index.html" class="text-white hover:text-yellow-300 text-lg mr-1">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <i class="fa-solid fa-store text-2xl text-yellow-300"></i>
      <div>
        <h1 class="text-sm font-bold leading-tight">సెల్లర్ డ్యాష్‌బోర్డ్</h1>
        <p class="text-[10px] text-purple-200">MeeStore పార్ట్‌నర్ పోర్టల్</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-purple-900 text-yellow-300 text-[11px] font-bold px-2.5 py-1 rounded-full border border-purple-400">
        కమిషన్: 10%
      </span>
    </div>
  </header>

  <main class="max-w-lg mx-auto p-3 space-y-4">

    <!-- 2. ప్రొడక్ట్ అప్‌లోడ్ కార్డ్ -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
      <h2 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2 border-b pb-2">
        <i class="fa-solid fa-cloud-arrow-up text-[#9c27b0]"></i> కొత్త ఉత్పత్తిని జోడించండి
      </h2>

      <form id="seller-form" onsubmit="saveProduct(event)" class="space-y-3">
        <!-- ప్రొడక్ట్ టైటిల్ -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ఉత్పత్తి పేరు (Product Title)*</label>
          <input type="text" id="title" required placeholder="ఉదా: ప్యూర్ కాటన్ కుర్తీ లేదా కొర్రలు 1kg" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
        </div>

        <!-- కేటగిరీ ఎంపిక -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">కేటగిరీ (Category)*</label>
          <select id="category" required class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none bg-white">
            <option value="">-- కేటగిరీ ఎంచుకోండి --</option>
            <option value="women">ఉమెన్ & గర్ల్స్ ఫ్యాషన్</option>
            <option value="men">మెన్ & బాయ్స్ ఫ్యాషన్</option>
            <option value="kids">కిడ్స్ వేర్</option>
            <option value="grocery">కిరాణా & ఆర్గానిక్ ప్రొవిజన్స్</option>
            <option value="home">హోమ్ & కిచెన్</option>
            <option value="accessories">యాక్సెసరీస్ & బ్యూటీ</option>
          </select>
        </div>

        <!-- ధరల వివరాలు -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">అసలు ధర (MRP ₹)*</label>
            <input type="number" id="mrp" required placeholder="999" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">అమ్మకపు ధర (Offer Price ₹)*</label>
            <input type="number" id="price" required oninput="calculatePayout()" placeholder="499" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
          </div>
        </div>

        <!-- లైవ్ పేఅవుట్ & కమిషన్ బాక్స్ -->
        <div class="bg-purple-50 border border-purple-200 rounded-lg p-2.5 text-xs space-y-1">
          <div class="flex justify-between text-gray-600">
            <span>ప్లాట్‌ఫామ్ ఫీజు (10% కమిషన్):</span>
            <span class="font-semibold text-purple-800">₹<span id="comm-fee">0</span></span>
          </div>
          <div class="flex justify-between text-gray-800 font-bold border-t border-purple-200 pt-1">
            <span>సెల్లర్‌కు వచ్చే నికర మొత్తం (Net Payout):</span>
            <span class="text-green-700 font-extrabold">₹<span id="seller-payout">0</span></span>
          </div>
        </div>

        <!-- స్టాక్ & షిప్పింగ్ బరువు -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">స్టాక్ పరిమాణం (Units)*</label>
            <input type="number" id="stock" required placeholder="20" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">బరువు (గ్రాముల్లో - Weight)*</label>
            <input type="number" id="weight" required placeholder="500" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
          </div>
        </div>

        <!-- ఫోటో URL -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ఉత్పత్తి ఫోటో లింక్ (Image URL)*</label>
          <input type="url" id="image" required placeholder="https://example.com/product.jpg" class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none">
        </div>

        <!-- వివరణ -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ఉత్పత్తి వివరణ (Description)</label>
          <textarea id="desc" rows="2" placeholder="మెటీరియల్, సైజులు, కలర్స్ మొదలైన వివరాలు..." class="w-full text-xs border rounded-lg p-2.5 focus:ring-2 focus:ring-purple-400 outline-none"></textarea>
        </div>

        <!-- సబ్‌మిట్ బటన్ -->
        <button type="submit" class="w-full bg-[#9c27b0] text-white py-3 rounded-lg font-bold text-xs hover:bg-purple-800 shadow transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus-circle text-sm"></i> ప్రొడక్ట్ లైవ్ చేయండి
        </button>
      </form>
    </div>

    <!-- 3. అప్‌లోడ్ చేసిన ప్రొడక్ట్స్ లిస్ట్ -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
      <div class="flex items-center justify-between border-b pb-2 mb-3">
        <h3 class="text-xs font-bold text-gray-800">
          అప్‌లోడ్ చేసిన ఉత్పత్తులు (<span id="count">0</span>)
        </h3>
        <span class="text-[10px] text-green-600 font-semibold flex items-center gap-1">
          <i class="fa-solid fa-circle text-[6px]"></i> షాప్ ఆన్‌లైన్
        </span>
      </div>
      <div id="product-list" class="space-y-2.5">
        <!-- ఉత్పత్తులు ఇక్కడ లోడ్ అవుతాయి -->
      </div>
    </div>

  </main>

  <script>
    let sellerProducts = JSON.parse(localStorage.getItem('m_seller_products')) || [];

    function calculatePayout() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const commission = Math.round(price * 0.10); // 10% కమిషన్
      const payout = price - commission;

      document.getElementById('comm-fee').innerText = commission;
      document.getElementById('seller-payout').innerText = payout > 0 ? payout : 0;
    }

    function saveProduct(e) {
      e.preventDefault();

      const newProd = {
        id: Date.now(),
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        mrp: document.getElementById('mrp').value,
        price: document.getElementById('price').value,
        stock: document.getElementById('stock').value,
        weight: document.getElementById('weight').value,
        image: document.getElementById('image').value,
        desc: document.getElementById('desc').value
      };

      sellerProducts.unshift(newProd);
      localStorage.setItem('m_seller_products', JSON.stringify(sellerProducts));
      renderSellerProducts();
      document.getElementById('seller-form').reset();
      calculatePayout();
      alert("✅ ఉత్పత్తి విజయవంతంగా స్టోర్‌కు జోడించబడింది!");
    }

    function deleteProduct(idx) {
      if(confirm("ఈ ఉత్పత్తిని తొలగించాలనుకుంటున్నారా?")) {
        sellerProducts.splice(idx, 1);
        localStorage.setItem('m_seller_products', JSON.stringify(sellerProducts));
        renderSellerProducts();
      }
    }

    function renderSellerProducts() {
      const list = document.getElementById('product-list');
      document.getElementById('count').innerText = sellerProducts.length;

      if (sellerProducts.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">ఇంకా ఏ ఉత్పత్తులూ జోడించలేదు.</p>`;
        return;
      }

      list.innerHTML = sellerProducts.map((p, idx) => `
        <div class="flex items-center gap-3 border rounded-lg p-2 bg-gray-50">
          <img src="${p.image}" class="w-12 h-12 object-cover rounded border" onerror="this.src='https://placehold.co/100x100?text=No+Image'">
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-gray-800 truncate">${p.title}</h4>
            <div class="text-[10px] text-gray-500 mt-0.5">
              <span>అమ్మకపు ధర: <b>₹${p.price}</b></span> | 
              <span>స్టాక్: <b>${p.stock}</b></span>
            </div>
            <span class="inline-block bg-purple-100 text-[#9c27b0] text-[9px] font-semibold px-2 py-0.5 rounded mt-1">
              ${p.category}
            </span>
          </div>
          <button onclick="deleteProduct(${idx})" class="text-red-500 hover:text-red-700 text-xs px-2">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    renderSellerProducts();
  </script>
</body>
      </html>
