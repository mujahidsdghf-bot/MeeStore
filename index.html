<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeeStore - ఆన్‌లైన్ షాపింగ్</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans pb-24">

  <header class="sticky top-0 z-50 bg-[#9c27b0] text-white p-3 shadow-md">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-bag-shopping text-2xl text-yellow-300"></i>
        <span class="text-xl font-bold tracking-wide">MeeStore</span>
      </div>
      <div class="flex items-center space-x-3">
        <a href="seller.html" class="bg-purple-900 border border-yellow-300 text-yellow-300 text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
          <i class="fa-solid fa-store"></i> సెల్లర్ అవ్వండి
        </a>
        <button onclick="openCart()" class="relative p-1">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cart-badge" class="absolute -top-1 -right-2 bg-yellow-400 text-black text-xs font-extrabold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </div>
    <div class="relative">
      <input type="text" id="search-box" onkeyup="filterProducts()" placeholder="చీరలు, కుర్తీలు, కిరాణా లేదా బ్రాండ్స్ వెతకండి..." class="w-full pl-10 pr-4 py-2 rounded-lg text-gray-800 text-xs focus:outline-none bg-white shadow-inner">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
    </div>
  </header>

  <section class="bg-white py-3 border-b shadow-sm">
    <div class="flex space-x-4 overflow-x-auto no-scrollbar px-3 text-center">
      <div onclick="selectCategory('all')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-pink-100 rounded-full flex items-center justify-center text-[#9c27b0] text-base font-bold border border-[#9c27b0]"><i class="fa-solid fa-border-all"></i></div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">అన్నీ</span>
      </div>
      <div onclick="selectCategory('grocery')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-green-50 rounded-full flex items-center justify-center text-green-600 text-base border border-green-200"><i class="fa-solid fa-wheat-awn"></i></div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">కిరాణా & మిల్లెట్స్</span>
      </div>
      <div onclick="selectCategory('women')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-pink-50 rounded-full flex items-center justify-center text-pink-600 text-base border border-pink-200"><i class="fa-solid fa-person-dress"></i></div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">ఉమెన్ & గర్ల్స్</span>
      </div>
      <div onclick="selectCategory('men')" class="cursor-pointer flex-shrink-0 flex flex-col items-center">
        <div class="w-12 h-12 p-3 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 text-base border border-blue-200"><i class="fa-solid fa-person"></i></div>
        <span class="text-[11px] font-semibold mt-1 text-gray-700">మెన్ & బాయ్స్</span>
      </div>
    </div>
  </section>

  <main class="px-3 py-3">
    <div id="product-grid" class="grid grid-cols-2 gap-2.5"></div>
  </main>

  <!-- కార్ట్ & డెలివరీ చెక్అవుట్ మోడల్ -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 flex justify-end hidden">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4 shadow-2xl overflow-y-auto no-scrollbar">
      <div class="flex justify-between items-center pb-3 border-b">
        <h2 class="text-base font-bold text-gray-800">ఆర్డర్ చెక్అవుట్</h2>
        <button onclick="closeCart()" class="text-gray-400 text-2xl">&times;</button>
      </div>
      
      <div id="cart-items" class="py-2 space-y-2 border-b mb-3"></div>

      <!-- డెలివరీ వివరాల ఫారమ్ -->
      <form onsubmit="submitCustomerOrder(event)" class="space-y-2.5">
        <h3 class="text-xs font-bold text-gray-700">డెలివరీ వివరాలు</h3>
        <input type="text" id="cust_name" required placeholder="మీ పూర్తి పేరు" class="w-full text-xs p-2 border rounded">
        <input type="tel" id="cust_phone" required placeholder="మొబైల్ నంబర్" class="w-full text-xs p-2 border rounded">
        <textarea id="cust_address" required rows="2" placeholder="పూర్తి అడ్రస్, డోర్ నం, ల్యాండ్‌మార్క్, పిన్‌కోడ్" class="w-full text-xs p-2 border rounded"></textarea>

        <h3 class="text-xs font-bold text-gray-700 mt-2">పేమెంట్ విధానం ఎంచుకోండి</h3>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="border p-2 rounded flex items-center gap-1.5 cursor-pointer has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50">
            <input type="radio" name="payment_mode" value="COD" checked class="accent-purple-700">
            <span>క్యాష్ ఆన్ డెలివరీ (COD)</span>
          </label>
          <label class="border p-2 rounded flex items-center gap-1.5 cursor-pointer has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50">
            <input type="radio" name="payment_mode" value="Prepaid (UPI)" class="accent-purple-700">
            <span>Prepaid (UPI ఆన్‌లైన్)</span>
          </label>
        </div>

        <div class="border-t pt-2 flex justify-between text-sm font-bold text-gray-800">
          <span>మొత్తం బిల్లు:</span>
          <span class="text-[#9c27b0]">₹<span id="cart-total">0</span></span>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-xs shadow hover:bg-green-700 flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-base"></i>
          <span>ఆర్డర్ కన్ఫర్మ్ చేసి పంపండి</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://meestore.onrender.com/api/products";
    let allProducts = [];
    let cart = [];

    async function loadProducts() {
      try {
        const res = await fetch(API_URL);
        allProducts = await res.json();
      } catch(e) {
        allProducts = [];
      }
      renderProducts(allProducts);
    }

    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      if(!items || items.length === 0) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">ఉత్పత్తులు లోడ్ అవుతున్నాయి...</p>`;
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="bg-white rounded-lg shadow-sm border p-2 flex flex-col justify-between">
          <img src="${p.image}" class="w-full h-32 object-cover rounded" onerror="this.src='https://placehold.co/300x200?text=Product'">
          <div class="mt-2">
            <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${p.title}</h4>
            <div class="flex items-center space-x-1 mt-1">
              <span class="text-sm font-bold">₹${p.price}</span>
              <span class="text-[10px] text-gray-400 line-through">₹${p.mrp}</span>
            </div>
            <button onclick="addToCart(${p.id})" class="mt-2 w-full bg-[#9c27b0] text-white text-xs py-1.5 rounded font-semibold">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = allProducts.find(p => p.id === id);
      if(item) {
        cart.push(item);
        document.getElementById("cart-badge").innerText = cart.length;
        document.getElementById("cart-badge").classList.remove("hidden");
      }
    }

    function openCart() {
      if(cart.length === 0) return alert("కార్ట్ ఖాళీగా ఉంది!");
      let total = 0;
      document.getElementById("cart-items").innerHTML = cart.map(i => {
        total += Number(i.price);
        return `<div class="flex justify-between text-xs py-1"><span>${i.title}</span><span class="font-bold">₹${i.price}</span></div>`;
      }).join('');
      document.getElementById("cart-total").innerText = total;
      document.getElementById("cart-modal").classList.remove("hidden");
    }

    function closeCart() {
      document.getElementById("cart-modal").classList.add("hidden");
    }

    function filterProducts() {
      const q = document.getElementById("search-box").value.toLowerCase();
      renderProducts(allProducts.filter(p => p.title.toLowerCase().includes(q)));
    }

    function selectCategory(cat) {
      if(cat === 'all') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function submitCustomerOrder(e) {
      e.preventDefault();
      const name = document.getElementById("cust_name").value;
      const phone = document.getElementById("cust_phone").value;
      const addr = document.getElementById("cust_address").value;
      const payMode = document.querySelector('input[name="payment_mode"]:checked').value;
      const total = document.getElementById("cart-total").innerText;
      
      const targetPhone = cart[0].seller_phone || "919999999999";

      let msg = `🛒 *కొత్త MeeStore ఆర్డర్!*%0A%0A`;
      msg += `👤 *కస్టమర్:* ${name} (${phone})%0A`;
      msg += `📍 *అడ్రస్:* ${addr}%0A`;
      msg += `💳 *పేమెంట్ విధానం:* ${payMode}%0A%0A`;
      msg += `📦 *ఆర్డర్ చేసిన వస్తువులు:*%0A`;
      cart.forEach((i, idx) => {
        msg += `${idx+1}. ${i.title} - ₹${i.price}%0A`;
      });
      msg += `%0A💰 *మొత్తం బిల్లు:* ₹${total}`;

      window.open(`https://wa.me/${targetPhone}?text=${msg}`, '_blank');
    }

    loadProducts();
  </script>
</body>
</html>
